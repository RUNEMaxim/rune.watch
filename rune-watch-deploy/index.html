<!-- Nicht-render-blockierendes Laden der Google-Fonts-Stylesheet: wird zunächst mit
     media="print" geladen (blockiert das Rendering NICHT), sobald die Datei da ist, wechselt
     onload media auf "all" und sie greift wie eine normale Stylesheet. Bis dahin rendert der
     Browser mit den System-Fallback-Fonts, die dank font-display:swap in der URL beim
     tatsächlichen Laden dann eingetauscht werden -- verbessert FCP/LCP, da das erste Rendering
     nicht mehr auf den Google-Fonts-Request warten muss. <noscript> als Fallback für den (sehr
     seltenen) Fall, dass JS deaktiviert ist. -->
<!-- font-display=optional statt swap: verhindert den späten Schrift-Tausch (System-Font ->
     Unbounded/Space Grotesk), der nach dem Umbau auf nicht-blockierendes Font-Laden zu einem
     großen, einmaligen Layout-Shift führte (viele große Zahlen-Displays ändern gleichzeitig
     ihre Breite). Mit "optional" bleibt für einen Seitenaufruf dauerhaft die Fallback-Schrift,
     falls die Google-Font nicht innerhalb von ~100ms bereitsteht -- kein nachträglicher Tausch,
     kein Shift mehr. FCP bleibt weiterhin nicht-blockierend. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=optional" rel="stylesheet"></noscript>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000000; min-height: 100vh; overscroll-behavior-x: none; }
  body { font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; }
  .tp-input::placeholder { color: #4C6062; }
  .tp-input:focus { outline: none; border-color: #00DEE1 !important; color: #F5F5F5 !important; box-shadow: 0 0 0 3px rgba(0,222,225,0.18) !important; }
  .tp-range-btn:hover { color: #00DEE1 !important; }
  .tp-price-tile-btn:hover { background: rgba(255,255,255,0.05) !important; }
  .tp-price-tile-btn:active { background: rgba(255,255,255,0.08) !important; }
  @keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes tpChartFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .tp-chart-fade-in { animation: tpChartFadeIn 0.45s ease; }
  /* Verhindert zuverlässig das native "Kopieren/Nachschlagen"-Kontextmenü bei längerem Drücken
     auf einem Chart -- ergänzt das JS-seitige preventDefault() in PortfolioChartInner. SVG-Text
     (Achsenbeschriftungen, Preis-Label im Fadenkreuz usw.) hält sich auf manchen mobilen Browsern
     NICHT zuverlässig an ein user-select:none, das nur auf einem Vorfahren-Element gesetzt ist --
     deshalb hier explizit auch auf svg text/tspan selbst. */
  .tp-chart-card svg, .tp-chart-card svg text, .tp-chart-card svg tspan {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* Weicher Übergang beim Wechseln zwischen Chart- und Details-Tab auf dem Handy (per Tab-Klick
     oder Wischgeste): die neu aktive Seite gleitet leicht aus der jeweiligen Richtung ein und
     blendet dabei ein, statt hart umzuschalten. Chart = "linke" Seite -> gleitet von links ein.
     Details = "rechte" Seite -> gleitet von rechts ein. Nur auf dem Handy aktiv, siehe
     @media (max-width: 640px) weiter unten. */
  @keyframes tpMobileTabInFromLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes tpMobileTabInFromRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
  /* Preiszeile jetzt immer oben (über den Tabs) sichtbar -- unabhängig von Bildschirmbreite
     und davon, ob gerade der Chart- oder der Details-Tab aktiv ist. Die Sidebar-Variante
     bleibt dauerhaft ausgeblendet, damit die Preise nicht verschwinden, wenn man in den
     Chart-Tab wechselt. */
  .tp-price-top { display: block; }
  .tp-price-sidebar { display: none; }
  .tp-nodestats-mobile { display: flex; margin-left: auto; }
  /* Kleines Tages-Verlaufs-Chart neben dem Preis, füllt den sonst leeren Platz in der breiten
     Preis-Karte -- nur auf PC-Bildschirmen sichtbar (auf dem Handy bleibt die Kachel kompakt). */
  .tp-price-daily-chart { display: none; }
  @media (min-width: 641px) {
    .tp-price-daily-chart { display: block; }
    /* Alt-Coin-Kachel soll sich auf dem PC nicht mehr über die volle Restbreite strecken,
       damit der Dropdown-Pfeil (Coin-Auswahl) näher am Mini-Chart bleibt statt weit rechts
       am Kachelrand zu kleben. */
    .tp-alt-price-btn { flex: 0 1 auto !important; }
  }
  .tp-flow {
    background: linear-gradient(90deg, transparent, #FFFFFF, transparent, #FFFFFF, transparent);
    background-size: 200% 100%;
    animation: flow 6s linear infinite;
  }
  .tp-spin { animation: spin 1s linear infinite; }
  .tp-totals-row { flex-wrap: wrap; }
  /* Kompakteres Layout auf schmalen Bildschirmen: weniger Innen-/Außenabstand,
     damit die Seite nicht unnötig in die Länge gezogen wird wie am Desktop. */
  @media (max-width: 640px) {
    .tp-content-row { gap: 12px !important; }
    .tp-main-card { padding: 16px 16px !important; margin-bottom: 12px !important; }
    .tp-main-card-header { margin-bottom: 12px !important; }
    .tp-chart-card { padding: 10px 4px 4px !important; }
    .tp-sidebar-col { gap: 12px !important; }
    .tp-side-card { padding: 14px 16px !important; }
    .tp-range-row { margin-bottom: 8px !important; }
    .tp-footer { margin-top: 20px !important; padding-top: 12px !important; }
    .tp-price-top { margin-top: 8px !important; margin-bottom: 12px !important; }
    .tp-totals-row { padding-top: 12px !important; }
    .tp-controls-row { flex-wrap: nowrap !important; padding-bottom: 4px; }
    .tp-controls-left { flex-wrap: nowrap !important; max-width: none !important; gap: 10px !important; flex-shrink: 0 !important; }
    .tp-controls-spacer { display: none !important; }
    .tp-controls-wallets { flex-shrink: 0 !important; gap: 10px !important; }
    .tp-controls-wallets > div > button { font-size: 11px !important; gap: 3px !important; }
    .tp-controls-nodestats { flex-shrink: 0 !important; margin-left: 0 !important; }
    .tp-controls-nodestats > button { font-size: 11px !important; gap: 4px !important; }
    .tp-nodestats-mobile { display: flex !important; margin-left: 0 !important; flex-shrink: 0 !important; }
  }
  /* CLS-Fix: reservierter Platz für die Chart-Karte, BEVOR die Chart-Daten geladen sind.
     Ohne das wächst die Karte beim Nachladen der Daten von (fast) leer auf ihre volle Höhe und
     schiebt alles darunter nach unten -- das war der Haupttreiber der CLS-Werte von 0.25-0.4.
     WICHTIG: Der Wert muss der TATSÄCHLICHEN Endhöhe der Karte entsprechen. Stand er zu hoch
     (vorher 360px), erzwang er eine überhohe Karte, in der der Chart nur oben klebte und
     darunter leerer Raum blieb -- die per height-Prop gesetzte Chart-Höhe war dann wirkungslos.
     Die Karte soll bündig mit dem 24h-Volumen-Kärtchen der Seitenspalte abschließen (~235px);
     die exakte Feinjustierung übernimmt zur Laufzeit matchedCardHeight in app.js. */
  .tp-chart-card { min-height: 235px; }
  @media (max-width: 640px) {
    .tp-chart-card { min-height: 230px; }
  }
  /* PC/Browser: eine einzige Seite, Chart und Details nebeneinander (kein Tab-Umschalten). */
  .tp-mobile-tabs { display: none; }
  .tp-content-row { justify-content: center; }
  .tp-chart-panel { display: block; }
  .tp-details-panel { display: flex; }
  /* Handy: ursprüngliches Verhalten wiederhergestellt -- zwei umschaltbare Tabs/Seiten
     (Chart-Tab / Details-Tab), genau wie vor den Layout-Änderungen für den Desktop. */
  @media (max-width: 640px) {
    .tp-mobile-tabs { display: flex; }
    .tp-chart-panel, .tp-details-panel { display: none !important; }
    .tp-chart-panel.tp-panel-active { display: block !important; animation: tpMobileTabInFromLeft 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
    .tp-details-panel.tp-panel-active { display: flex !important; animation: tpMobileTabInFromRight 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
    .tp-chart-panel, .tp-details-panel { max-width: none !important; min-width: 0 !important; width: 100% !important; }
  }
  /* Ø-Kaufpreis-Dropdown: auf dem PC wie gehabt (rechtsbündig unter dem Trigger-Button). Auf dem
     Handy reicht der Platz neben dem Button oft nicht -- das Panel ragte dann über den
     Bildschirmrand hinaus ("hängt zur Hälfte im Nichts"). Deshalb wird es auf schmalen
     Bildschirmen stattdessen zu einem zentrierten, fest positionierten Overlay mit Backdrop --
     garantiert komplett innerhalb des Bildschirms, unabhängig davon, wo der Button gerade sitzt. */
  .tp-purchase-dropdown-backdrop { display: none; }
  @media (max-width: 640px) {
    .tp-purchase-dropdown-backdrop {
      display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 29;
    }
    .tp-purchase-dropdown-panel {
      position: fixed !important; top: 50% !important; left: 12px !important; right: 12px !important;
      bottom: auto !important; transform: translateY(-50%); width: auto !important; max-width: none !important;
      max-height: 82vh !important; margin-top: 0 !important;
    }
  }
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000000;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
    <div style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,222,225,0.18);border-top-color:#00DEE1;animation:tpBootSpin 0.8s linear infinite;"></div>
    <div style="color:#4C6062;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.04em;">rune.watch wird geladen &hellip;</div>
  </div>
</div></div>
<style>@keyframes tpBootSpin{to{transform:rotate(360deg);}}</style>

<!-- React/ReactDOM jetzt lokal aus /vendor statt von unpkg.com geladen: spart eine komplette
     DNS+TLS+Request-Runde zu einer dritten Domain im kritischen Rendering-Pfad. Alle drei
     Scripts (React, ReactDOM, App) haben "defer", damit sie das Parsen von HTML/CSS NICHT mehr
     blockieren -- der Browser kann den Rest der Seite (inkl. des Boot-Spinners oben) sofort
     rendern, während die Scripts im Hintergrund laden. "defer" garantiert bei klassischen
     Scripts (kein type="module"), dass sie trotzdem in genau dieser Reihenfolge ausgeführt
     werden, NACH dem HTML-Parsing aber VOR DOMContentLoaded -- App-Script kann also weiterhin
     sicher auf die globalen React/ReactDOM-Objekte zugreifen. Der frühere ~500-KB-Inline-Block
     ist dafür in eine eigene Datei app.js ausgelagert (nur externe Scripts können defer nutzen,
     Inline-Scripts würden defer ignorieren und weiterhin sofort/blockierend laufen). -->
<!-- Alle drei Dateien liegen FLACH auf derselben Ebene wie diese index.html (kein Unterordner) --
     ein "vendor/"-Unterordner ging beim Hochladen wiederholt verloren und führte zu 404-Fehlern
     und einer ewig ladenden Seite. Relative Pfade (ohne führenden Slash), damit es auch dann
     funktioniert, wenn die Seite nicht direkt im Domain-Root liegt.
     "defer" sorgt dafür, dass das Parsen von HTML/CSS nicht blockiert wird, die
     Ausführungsreihenfolge aber garantiert bleibt (React -> ReactDOM -> App). -->
<script defer src="react.production.min.js"></script>
<script defer src="react-dom.production.min.js"></script>
<script defer src="app.js"></script>
</body>
