  // scheinbar einbrechen lässt).
  const accruedAwardByAddrRef = useRef({});

  // Lädt aktuellen Bond + volle Bond/Unbond-Historie für eine beliebige Adresse. Gibt das
  // Ergebnis auch direkt zurück (nicht nur per State), damit Aufrufer sofort damit
  // weiterarbeiten können, ohne auf den nächsten Render warten zu müssen.
  const fetchNodeRewardsFor = async (addr) => {
    setNodeRewardsData((prev) => ({ ...prev, [addr]: { ...(prev[addr] || {}), loading: true, error: null } }));
    try {
      const [bondInfo, ledger] = await Promise.all([fetchBondedRune(addr), fetchBondLedger(addr)]);
      accruedAwardByAddrRef.current[addr] = bondInfo.accruedAward;
      // Alle Node-Adressen ever: aktuelle Treffer UND alle aus den Bond/Unbond-Transaktionen
      // selbst (deren Metadaten die Node-Adresse direkt enthalten) — deckt auch Nodes ab, von
      // denen die Adresse inzwischen komplett abgebonded hat und die daher in der aktuellen
      // Node-Liste nicht mehr auftauchen.
      const txNodeAddresses = (ledger.transactions || []).map((tx) => tx.nodeAddress).filter(Boolean);
      const allNodeAddresses = Array.from(new Set([...(bondInfo.matchedNodeAddresses || []), ...txNodeAddresses]));
      if (!ledger.success) {
        const data = { loading: false, error: 'NO_LEDGER', current: bondInfo.bonded, principal: null, transactions: [], earliestDateMs: null, accruedAward: bondInfo.accruedAward, matchedNodeAddresses: bondInfo.matchedNodeAddresses || [] };
        setNodeRewardsData((prev) => ({ ...prev, [addr]: data }));
        return data;
      }
      const data = { loading: false, error: null, current: bondInfo.bonded, principal: ledger.principal, transactions: ledger.transactions, earliestDateMs: ledger.earliestDateMs, accruedAward: bondInfo.accruedAward, matchedNodeAddresses: allNodeAddresses };
      setNodeRewardsData((prev) => ({ ...prev, [addr]: data }));
      return data;
    } catch (e) {
      const data = { loading: false, error: 'FETCH_FAILED', current: null, principal: null, transactions: [], earliestDateMs: null, accruedAward: null, matchedNodeAddresses: [] };
      setNodeRewardsData((prev) => ({ ...prev, [addr]: data }));
      return data;
    }
  };

  // Läuft, sobald mindestens eine Adresse mit Bond > 0 geladen wurde: holt für JEDE davon die
  // Bond-Historie + baut die automatische Reward-Historie aus allen relevanten Churns seit dem
  // ersten Bond-Datum auf. Adressen werden nacheinander abgearbeitet (nicht parallel), damit der
  // gemeinsame Lade-/Fortschrittsstatus einfach bleibt — bei den üblichen 1-3 Wallets kein
  // spürbarer Nachteil.
  useEffect(() => {
    if (!trackedAddresses.length) return;
    let cancelled = false;
    (async () => {
      setAutoHistoryStatus('loading');
      setAutoHistoryProgress(null);
      try {
        const churns = await fetchChurnsList();
        if (cancelled) return;
        if (!churns.length) {
          console.warn('[RUNE Portfolio] Churn-Liste von Midgard leer/nicht abrufbar — Reward-Historie kann nicht aufgebaut werden.');
          setAutoHistoryStatus('error');
          return;
        }
        let anyFailedCompletely = false;
        for (const addr of trackedAddresses) {
          if (cancelled) return;
          const data = await fetchNodeRewardsFor(addr);
          if (cancelled) return;
          const { entries, attempted, failed } = await buildAutoRewardHistory(
            addr, data.matchedNodeAddresses, data.earliestDateMs, churns,
            (partialEntries, done, total) => {
              if (cancelled) return;
              setAutoRewardHistory((prevHist) => ({ ...prevHist, [addr]: partialEntries }));
              setAutoHistoryProgress({ done, total });
            }
          );
          if (cancelled) return;
          setAutoRewardHistory((prevHist) => ({ ...prevHist, [addr]: entries }));
          if (attempted > 0 && failed === attempted) {
            console.warn(`[RUNE Portfolio] Alle ${attempted} historischen Höhenabfragen für ${addr} fehlgeschlagen.`);
            anyFailedCompletely = true;
          } else if (attempted > 0 && entries.length === 0) {
            console.warn(`[RUNE Portfolio] Alle historischen Abfragen für ${addr} erfolgreich, aber durchgehend 0 RUNE.`);
            anyFailedCompletely = true;
          }
        }
        if (!cancelled) setAutoHistoryStatus(anyFailedCompletely ? 'error' : 'done');
      } catch (e) {
        console.warn('[RUNE Portfolio] Fehler beim Aufbau der Reward-Historie:', e);
        if (!cancelled) setAutoHistoryStatus('error');
      }
    })();
    return () => { cancelled = true; };
  }, [trackedAddresses]);

  // Der aufgelaufene Reward wächst laufend mit jedem Block — deshalb separat und öfter
  // aktualisieren als die (teurere) volle Bond-Historie, ohne diese erneut abzufragen.
  // Gleicher Effekt wie beim Bonded-Wert: current_award sollte innerhalb eines Churn-Zyklus nur
  // WACHSEN, ABER: mein Anteil daran hängt vom Bond-Anteil ab, der sich verschiebt, sobald
  // ANDERE Bond-Provider am selben Node bonden/unbonden — das ist eine echte, legitime
  // Schwankung, kein Datenfehler. Ein pauschales "jeder Rückgang ist verdächtig" wäre daher
  // falsch. Nur EIN Muster ist eindeutig ein Fehler: der Wert bricht auf (nahe) 0 ein, OBWOHL
  // laut Churn-Countdown noch gar kein Churn stattgefunden haben kann — das deutet auf eine
  // kurzzeitig unvollständige Node-Antwort hin, nicht auf einen echten Reset.
  useEffect(() => {
    accruedAwardByAddrRef.current = {}; // bei Adressänderung zurücksetzen
  }, [trackedAddresses]);
  useEffect(() => {
    if (!trackedAddresses.length) return;
    const refreshAccrued = async () => {
      for (const addr of trackedAddresses) {
        const bondInfo = await fetchBondedRune(addr);
        if (bondInfo.accruedAward == null) continue;
        const prev = accruedAwardByAddrRef.current[addr];
        const churnCouldNotHaveHappenedYet = churnCountdown && churnCountdown.nextChurnEstimateMs != null
          && churnCountdown.nextChurnEstimateMs - Date.now() > 10 * 60 * 1000; // > 10 Min bis zum nächsten Churn
        const looksLikeGlitch = prev != null && prev > 2 && bondInfo.accruedAward < 0.5 && churnCouldNotHaveHappenedYet;
        const finalValue = looksLikeGlitch ? prev : bondInfo.accruedAward;
        if (looksLikeGlitch) {
          console.warn('[RUNE Portfolio] Verdächtiger Accrued-Reward-Einbruch verworfen:', addr, prev, '->', bondInfo.accruedAward);
        }
        accruedAwardByAddrRef.current[addr] = finalValue;
        setNodeRewardsData((p) => (p[addr] ? { ...p, [addr]: { ...p[addr], accruedAward: finalValue } } : p));
      }
    };
    const id = setInterval(refreshAccrued, 60 * 1000);
    return () => clearInterval(id);
  }, [trackedAddresses, churnCountdown]);


  const fetchPortfolio = useCallback(async (walletsOverride) => {
    const list = (walletsOverride || wallets).map((w) => w.trim()).filter(Boolean);
    if (!list.length) return;
    setLoading(true);
    setError(null);

    try {
      // Balance + Bonded für JEDE Wallet einzeln abfragen (parallel), dann zu einer
      // Gesamtsumme zusammenzählen. Schlägt eine einzelne Wallet fehl, blockiert das nicht die
      // anderen — nur wenn ALLE fehlschlagen, wird ein Fehler angezeigt.
      const perWalletResults = await Promise.allSettled(list.map(async (addr) => {
        if (!addr.startsWith('thor1')) throw new Error(t('invalidAddress', lang));
        let balJson;
        try {
          balJson = await fetchBalanceWithFallback(addr);
        } catch (e) {
          if (e && e.message === 'NOT_FOUND') throw new Error(t('addressNotFound', lang));
          throw new Error(t('corsError', lang));
        }
        const runeEntry = (balJson.balances || []).find((b) => b.denom === 'rune');
        const availableAmount = runeEntry ? parseInt(runeEntry.amount, 10) / 1e8 : 0;

        // Bonded RUNE separat abfragen — darf scheitern, ohne den Rest zu blockieren. Schlägt sie
        // fehl (Node-Liste kurzzeitig nicht erreichbar), NICHT auf 0 zurückfallen — sonst "zuckt"
        // Total RUNE bei jedem Refresh, sobald dieser eine Endpoint mal einen Aussetzer hat.
        //
        // Zusätzliches Problem: die Node-Liste (Bond-Provider-Daten) aktualisiert sich manchmal
        // mit Verzögerung gegenüber der Bank-Balance. Bondet man frisch RUNE dazu, sinkt die
        // verfügbare Balance sofort, aber der neue Bond taucht in der Node-Liste noch nicht auf --
        // dadurch würde Total RUNE kurzzeitig um genau den frisch gebondeten Betrag einbrechen
        // ("verschwundene" RUNE). Erkennung: Bonded sinkt, ohne dass die verfügbare Balance
        // entsprechend gestiegen ist -> dann den alten (höheren) Bonded-Wert vorerst behalten.
        // (Pro Wallet-Adresse getrennt, damit sich mehrere Wallets nicht gegenseitig verfälschen.)
        const bondInfo = await fetchBondedRune(addr);
        let bondedAmount;
        if (bondInfo.bonded == null) {
          bondedAmount = bondedByAddrRef.current[addr] ?? null;
        } else {
          const prevBonded = bondedByAddrRef.current[addr];
          const prevAvailable = balanceByAddrRef.current[addr];
          const bondedDrop = prevBonded != null ? prevBonded - bondInfo.bonded : 0;
          const availableRise = prevAvailable != null ? availableAmount - prevAvailable : 0;
          const looksLikeLag = bondedDrop > 0.01 && availableRise < bondedDrop - 0.01;
          bondedAmount = looksLikeLag ? prevBonded : bondInfo.bonded;
        }
        bondedByAddrRef.current[addr] = bondedAmount;
        balanceByAddrRef.current[addr] = availableAmount;
        return { addr, availableAmount, bondedAmount: bondedAmount || 0 };
      }));

      const succeeded = perWalletResults
        .filter((r) => r.status === 'fulfilled')
        .map((r) => r.value);
      if (!succeeded.length) {
        const firstError = perWalletResults.find((r) => r.status === 'rejected');
        throw (firstError && firstError.reason) || new Error(t('genericError', lang));
      }
      const failedWallets = perWalletResults
        .map((r, i) => (r.status === 'rejected' ? list[i] : null))
        .filter(Boolean);
      if (failedWallets.length) {
        console.warn('[RUNE Portfolio] Diese Wallets konnten nicht geladen werden und wurden aus der Summe ausgelassen:', failedWallets);
      }

      const availableAmount = succeeded.reduce((s, r) => s + r.availableAmount, 0);
      const bondedAmount = succeeded.reduce((s, r) => s + r.bondedAmount, 0);
      const totalAmount = availableAmount + bondedAmount;

      let currentPrice = null;
      let currentAltPrice = null;
      let hist = [];
      try {
        // Aktuellen Preis primär von Binance holen (exakter Live-Preis dieser Börse); nur für
        // USD/EUR sinnvoll (EUR/USDT-Paar existiert), für alle anderen Währungen direkt
        // CoinGecko in der Zielwährung nutzen. Schlägt Binance fehl, auf CoinGecko ausweichen.
        const wantsUsdOrEur = currency === 'usd' || currency === 'eur';
        try {
          if (!wantsUsdOrEur) throw new Error('SKIP_BINANCE_FOR_OTHER_CURRENCY');
          const binRes = await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=%5B%22RUNEUSDT%22%2C%22${altCoin.binanceSymbol}%22%2C%22EURUSDT%22%5D`);
          if (!binRes.ok) throw new Error('BINANCE_FAIL');
          const binJson = await binRes.json();
          const getP = (sym) => {
            const entry = Array.isArray(binJson) ? binJson.find((x) => x.symbol === sym) : null;
            return entry ? parseFloat(entry.price) : null;
          };
          const runeUsd = getP('RUNEUSDT');
          const altUsd = getP(altCoin.binanceSymbol);
          const eurUsdt = getP('EURUSDT'); // wie viele USDT für 1 EUR
          if (runeUsd == null || altUsd == null || eurUsdt == null) throw new Error('BINANCE_FAIL');
          currentPrice = { usd: runeUsd, local: currency === 'eur' ? runeUsd / eurUsdt : runeUsd };
          currentAltPrice = { usd: altUsd, local: currency === 'eur' ? altUsd / eurUsdt : altUsd };
        } catch (binanceErr) {
          const priceRes = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=thorchain,${altCoin.geckoId}&vs_currencies=usd,${currency}`);
          if (!priceRes.ok) throw binanceErr;
          const priceJson = await priceRes.json();
          currentPrice = priceJson && priceJson.thorchain
            ? { usd: priceJson.thorchain.usd, local: priceJson.thorchain[currency] }
            : null;
          currentAltPrice = priceJson && priceJson[altCoin.geckoId]
            ? { usd: priceJson[altCoin.geckoId].usd, local: priceJson[altCoin.geckoId][currency] }
            : null;
          if (!currentPrice || !currentAltPrice) throw binanceErr;
        }

        // Denselben (gecachten/deduplizierten) Abruf wie priceHistoryFull wiederverwenden,
        // statt eine zweite, redundante CoinGecko-Anfrage zu starten (siehe fetchPriceHistoryFullOnce).
        const fullHist = await fetchPriceHistoryFullOnce(currency);
        if (!fullHist) throw new Error('CHART_FAIL');
        const pricesUsd = fullHist.usd;
        const pricesLocal = fullHist.local;
        hist = pricesUsd.map(([ts, pUsd], i) => {
          const pLocal = pricesLocal[i] ? pricesLocal[i][1] : pUsd; // Fallback, falls Arrays mal nicht exakt gleich lang sind
          return { date: ts, priceUsd: pUsd, priceLocal: pLocal, valueUsd: pUsd * totalAmount, valueLocal: pLocal * totalAmount };
        });
      } catch (e) {
        throw new Error(t('priceDataError', lang));
      }

      setBalance(availableAmount);
      setBonded(bondedAmount);
      setPrice(currentPrice);
      setAltPrice(currentAltPrice);
      setHistory(hist);
      setHasData(true);
      setLastUpdated(new Date());
      fetchVolume24h().then(setVolume24h);
      fetchVolumeHistory().then(setVolumeHistory);
      // Rewards-Historie für ALLE Wallets mit Bond > 0 aufbauen (kombiniert).
      const bondedWallets = succeeded.filter((r) => r.bondedAmount > 0).map((r) => r.addr);
      setTrackedAddresses(bondedWallets);
    } catch (e) {
      setError((e && e.message) || (t('genericError', lang)));
      setHasData(false);
    } finally {
      setLoading(false);
    }
  }, [wallets, lang, fetchPriceHistoryFullOnce, altCoin, currency]);

  // Beim Start automatisch laden, falls Wallets gespeichert sind.
  useEffect(() => {
    if (wallets.length) {
      fetchPortfolio();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Klick auf den Suchen/Hinzufügen-Button: ist eine Adresse eingetippt, wird sie der
  // Wallet-Liste hinzugefügt (falls neu) und die kombinierte Summe neu geladen; ist das Feld
  // leer, wird einfach die bestehende Liste aktualisiert (Refresh).
  const handleAddOrRefreshWallet = () => {
    const val = address.trim();
    if (val) {
      if (!val.startsWith('thor1')) {
        setError(t('invalidAddress', lang));
        return;
      }
      const newList = wallets.includes(val) ? wallets : [...wallets, val];
      setWallets(newList);
      setAddress('');
      fetchPortfolio(newList);
    } else {
      fetchPortfolio();
    }
  };

  const filteredHistory = useMemo(() => {
    const cutoff = Date.now() - range * 24 * 60 * 60 * 1000;
    return history
      .filter((h) => h.date >= cutoff)
      .map((h) => ({
        date: h.date,
        value: currency === 'usd' ? h.valueUsd : h.valueLocal,
        price: currency === 'usd' ? h.priceUsd : h.priceLocal,
      }));
  }, [history, range, currency]);

  const activePrice = price ? (currency === 'usd' ? price.usd : price.local) : null;
  const activeAltPrice = altPrice ? (currency === 'usd' ? altPrice.usd : altPrice.local) : null;

  // Kombinierte Preis-Box: RUNE links, wählbarer Vergleichs-Coin rechts (Klick auf das Icon/den
  // Preis öffnet eine Auswahl aller von THORChain unterstützten Gas-Assets). Wird sowohl oben
  // (mobil) als auch in der Sidebar (Desktop) gerendert -- welche Variante sichtbar ist,
  // steuert CSS (siehe .tp-price-top / .tp-price-sidebar Media Query weiter oben im <style>-Block).
  const priceRowBox = (activePrice != null || activeAltPrice != null) && (
    <div className="tp-side-card" style={{ ...cardShellStyle, padding: '16px 18px', position: 'relative' }}>
      <div style={{ display: 'flex' }}>
        <div style={{ flex: 1, minWidth: 0, paddingRight: 12 }}>
          <div style={{ color: '#8A8A8A', fontSize: 11, fontWeight: 700, letterSpacing: '0.03em', marginBottom: 8, fontFamily: "'Inter', sans-serif" }}>
            RUNE
          </div>
          <div style={{ color: '#FFFFFF', fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 19, lineHeight: 1.2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {activePrice != null ? fmtUSDPrecise(activePrice, lang, currency) : '—'}
          </div>
        </div>
        <div style={{ width: 1, background: '#2A2A2A', margin: '0 4px' }} />
        <button
          onClick={() => setAltCoinPickerOpen((v) => !v)}
          title={t('tapChooseCoin', lang)}
          style={{
            flex: 1, minWidth: 0, paddingLeft: 12, paddingRight: 0, paddingTop: 0, paddingBottom: 0, margin: 0,
            background: 'transparent', border: 'none', textAlign: 'left', cursor: 'pointer', font: 'inherit', color: 'inherit',
            display: 'block',
          }}
        >
          <div style={{ color: '#8A8A8A', fontSize: 11, fontWeight: 700, letterSpacing: '0.03em', marginBottom: 8, fontFamily: "'Inter', sans-serif" }}>
            {altCoin.code} <span style={{ fontSize: 10 }}>▾</span>
          </div>
          <div style={{ color: '#FFFFFF', fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 19, lineHeight: 1.2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {activeAltPrice != null ? (altCoin.code === 'BTC'
              ? fmtUSDRounded(activeAltPrice, lang, currency)
              : activeAltPrice.toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), minimumFractionDigits: 2, maximumFractionDigits: 2 })
            ) : '—'}
          </div>
        </button>
      </div>
      {altCoinPickerOpen && (
        <div style={{
          position: 'absolute', top: '100%', right: 0, marginTop: 6, zIndex: 20,
          background: '#151515', border: '1px solid #2A2A2A', borderRadius: 10,
          padding: 6, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 4, width: 200,
          boxShadow: '0 8px 24px rgba(0,0,0,0.5)',
        }}>
          {ALT_COIN_OPTIONS.map((c) => (
            <button
              key={c.code}
              onClick={() => { setAltCoinCode(c.code); setAltCoinPickerOpen(false); }}
              title={c.label}
              style={{
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: c.code === altCoinCode ? '#232323' : 'transparent',
                color: c.code === altCoinCode ? '#FFFFFF' : '#AAAAAA',
                border: 'none', borderRadius: 8, padding: '8px 4px', cursor: 'pointer',
                fontSize: 11, fontWeight: 700, fontFamily: "'Inter', sans-serif",
              }}
            >
              {c.code}
            </button>
          ))}
        </div>
      )}
    </div>
  );

  const totalRune = balance != null ? balance + (bonded || 0) : null;
  const currentValue = totalRune != null && activePrice != null ? totalRune * activePrice : null;
  const rangeStartValue = filteredHistory[0] && filteredHistory[0].value;
  const rangeChangePct = currentValue != null && rangeStartValue
    ? ((currentValue - rangeStartValue) / rangeStartValue) * 100
    : null;
  const isPositive = rangeChangePct != null && rangeChangePct >= 0;

  // Bond-Rewards-Karte für ALLE aktuell getrackten Wallet-Adressen zusammen (kombinierte Summe).
  const rewardsDataList = trackedAddresses.map((a) => nodeRewardsData[a]).filter(Boolean);
  const hasAnyNodeRewardsData = rewardsDataList.length > 0;
  const nodeRewardsLoading = hasAnyNodeRewardsData && rewardsDataList.some((d) => d.loading);
  const nodeRewardsLoaded = hasAnyNodeRewardsData && rewardsDataList.every((d) => !d.loading);
  const nodeRewardsUsableEntries = rewardsDataList.filter((d) => !d.loading && !d.error && d.current != null && d.principal != null);
  const nodeRewardsAllFailed = nodeRewardsLoaded && nodeRewardsUsableEntries.length === 0;

  // Automatisch rekonstruierte Einträge (aus THORNode-Höhenabfragen), über alle getrackten
  // Adressen zusammengefasst.
  const autoEventsAll = trackedAddresses.flatMap((a) => autoRewardHistory[a] || []);

  // Historische Einträge (Datum, RUNE-Betrag, historischer Preis) — komplett automatisch,
  // keine manuelle Liste mehr nötig.
  const rewardOnlyEvents = autoEventsAll
    .map((ev) => ({
      ...ev,
      priceUsd: priceHistoryFull ? findPriceAt(priceHistoryFull.usd, ev.dateMs) : null,
      priceLocal: priceHistoryFull ? findPriceAt(priceHistoryFull.local, ev.dateMs) : null,
    }))
    .filter((ev) => ev.amount > 1e-9)
    .sort((a, b) => (b.dateMs || 0) - (a.dateMs || 0));

  // Gesamtsumme: AUSSCHLIESSLICH die exakte, per-Churn verifizierte Summe aus den historischen
  // Höhenabfragen (rewardOnlyEvents) — genau wie bei boonetools' rune_stack-Snapshots. Keine
  // "current_bond − principal"-Nährung mehr als Ersatz, da die bei Slashing oder unvollständiger
  // Midgard-Historie erheblich danebenliegen kann. Ist die Historie noch nicht fertig geladen,
  // zeigt die Karte das auch so an (kein falscher Ersatzwert).
  const autoHistorySum = rewardOnlyEvents.reduce((s, ev) => s + ev.amount, 0);
  const combinedRewardsRune = autoHistoryStatus === 'done' ? autoHistorySum : null;
  const combinedRewardsUsd = combinedRewardsRune != null && activePrice != null ? combinedRewardsRune * activePrice : null;

  // Diagnose-Log zum Abgleichen, falls die Summe nicht plausibel wirkt — nur im DevTools-
  // Log (F12) sichtbar, läuft nur wenn sich einer der Werte wirklich ändert (nicht bei jedem
  // Render / Preis-Tick), damit die Konsole nicht zugespamt wird.
  useEffect(() => {
    if (!trackedAddresses.length || !nodeRewardsLoaded) return;
    console.info('[RUNE Portfolio] Reward-Summe Diagnose', {
      addresses: trackedAddresses,
      totalCurrent: rewardsDataList.reduce((s, d) => s + (d.current || 0), 0),
      totalPrincipal: rewardsDataList.reduce((s, d) => s + (d.principal || 0), 0),
      autoHistorySum,
      autoHistoryStatus,
      autoEventsCount: autoEventsAll.length,
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [trackedAddresses, nodeRewardsLoaded, autoHistorySum, autoEventsAll.length, autoHistoryStatus]);

  // Prognose für den nächsten Reward: NICHT aus dem statistischen Muster vergangener
  // Auszahlungen geschätzt, sondern live aus dem tatsächlichen, laufend wachsenden
  // current_award-Zähler von THORNode (siehe fetchBondedRune) — summiert über alle Wallets.
  // Das ist der Betrag, der beim nächsten Churn ausgezahlt wird, plus Countdown bis dahin.
  const accruedEntries = rewardsDataList.filter((d) => !d.loading && d.accruedAward != null);
  const accruedAwardSum = accruedEntries.length ? accruedEntries.reduce((s, d) => s + d.accruedAward, 0) : null;
  const nextRewardForecast = accruedAwardSum != null ? {
    accruedAward: accruedAwardSum,
    accruedAwardUsd: activePrice != null ? accruedAwardSum * activePrice : null,
    nextChurnEstimateMs: churnCountdown ? churnCountdown.nextChurnEstimateMs : null,
    halted: churnCountdown ? !!churnCountdown.halted : false,
  } : null;



  const nodeRewardsBox = hasAnyNodeRewardsData && (
    <div className="tp-side-card" style={{ background: '#0D0D0D', border: '1px solid #2A2A2A', borderRadius: 16, padding: '20px' }}>
      <div style={{ color: '#999999', fontSize: 12, marginBottom: 12, letterSpacing: '0.03em', textTransform: 'uppercase' }}>
        {t('bondRewards', lang)}
      </div>
      {nodeRewardsLoading && (
        <div style={{ color: '#8A8A8A', fontSize: 12 }}>{t('loading', lang)}</div>
      )}
      {!nodeRewardsLoading && nodeRewardsAllFailed && (
        <div style={{ color: '#F0A0A0', fontSize: 12 }}>
          {t('couldNotLoadRewardHistory', lang)}
        </div>
      )}
      {!nodeRewardsLoading && !nodeRewardsAllFailed && (
        <>
          <div style={{ color: '#F5F5F5', fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 24, lineHeight: 1.2, marginBottom: 2, display: 'flex', alignItems: 'center', gap: 6 }}>
            {combinedRewardsRune != null
              ? (<>+{fmtRune(combinedRewardsRune, lang)}<IconRuneR size={7} gradientId="runeRGradNodeTotal" /></>)
              : (autoHistoryStatus === 'loading'
                  ? <span style={{ fontSize: 14, color: '#8A8A8A', fontFamily: "'Inter', sans-serif" }}>{t('calculating', lang)}</span>
                  : '—')}
          </div>
          <div style={{ color: '#A8D8B9', fontSize: 13, marginBottom: 12 }}>
            {combinedRewardsUsd != null ? `+${fmtUSD(combinedRewardsUsd, lang, currency)}` : ''}
          </div>

          {nextRewardForecast && (
            <div style={{ background: '#151515', border: '1px solid #262626', borderRadius: 12, padding: '12px 14px', marginBottom: 14 }}>
              <div style={{ color: '#8A8A8A', fontSize: 10.5, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.03em', marginBottom: 6 }}>
                {t('accruedReward', lang)}
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                  <div style={{ color: '#F5F5F5', fontSize: 15, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", display: 'flex', alignItems: 'center', gap: 5 }}>
                    +{fmtRune(nextRewardForecast.accruedAward, lang)}<IconRuneR size={5} gradientId="runeRGradForecast" />
                  </div>
                  {nextRewardForecast.accruedAwardUsd != null && (
                    <div style={{ color: '#A8D8B9', fontSize: 12 }}>
                      +{fmtUSD(nextRewardForecast.accruedAwardUsd, lang, currency)}
                    </div>
                  )}
                </div>
                {nextRewardForecast.halted ? (
                  <div style={{ color: '#F0A0A0', fontSize: 11 }}>
                    {t('churningHalted', lang)}
                  </div>
                ) : nextRewardForecast.nextChurnEstimateMs != null && (
                  <div style={{ color: '#666666', fontSize: 11 }}>
                    {'~'}{fmtCountdown(nextRewardForecast.nextChurnEstimateMs, lang)}
                  </div>
                )}
              </div>
            </div>
          )}

          <button
            onClick={() => setRewardsListExpanded((v) => !v)}
            style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%',
              background: 'transparent', border: 'none', padding: 0, cursor: 'pointer', marginBottom: rewardsListExpanded ? 4 : 0,
            }}
          >
            <span style={{
              fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em',
              color: '#F5F5F5',
            }}>
              {`${t('rewardsHistory', lang)} (${rewardOnlyEvents.length})`}
            </span>
            <span style={{ color: '#8A8A8A', fontSize: 11, display: 'flex', alignItems: 'center', gap: 4 }}>
              {autoHistoryStatus === 'loading' && (t('loading', lang))}
              <span style={{ display: 'inline-block', transform: rewardsListExpanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }}>▾</span>
            </span>
          </button>
          {rewardsListExpanded && (
            <>
              <div style={{ color: '#555555', fontSize: 10, marginBottom: 6 }}>
                {autoHistoryStatus === 'loading' && (
                  autoHistoryProgress
                    ? `${t('fetchingRewardHistory', lang)} (${autoHistoryProgress.done}/${autoHistoryProgress.total})`
                    : t('fetchingRewardHistory', lang)
                )}
                {autoHistoryStatus === 'done' && `${autoEventsAll.length} ${t('allEntriesVerified', lang)}`}
                {autoHistoryStatus === 'error' && t('totalAboveAccurate', lang)}
              </div>
              <div style={{ maxHeight: 220, overflowY: 'auto', display: 'flex', flexDirection: 'column', paddingRight: 4 }}>
                {rewardOnlyEvents.map((tx, i) => {
                  const priceForCurrency = currency === 'usd' ? tx.priceUsd : tx.priceLocal;
                  return (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', fontSize: 10.5, color: '#8A8A8A', padding: '3px 0', borderBottom: '1px solid #1A1A1A' }}>
                      <span>
                        {tx.dateMs
                          ? new Date(tx.dateMs).toLocaleDateString(localeFor(lang), { day: '2-digit', month: 'short', year: '2-digit' })
                          : '—'}
                      </span>
                      <span style={{ display: 'flex', alignItems: 'baseline', gap: 5 }}>
                        <span style={{ color: '#F5F5F5' }}>+{fmtRune(tx.amount, lang)}</span>
                        {priceForCurrency != null && (
                          <span style={{ color: '#555555', fontSize: 9 }}>
                            {t('atWord', lang)} {fmtUSDPrecise(priceForCurrency, lang, currency)}
                          </span>
                        )}
                      </span>
                    </div>
                  );
                })}
                {rewardOnlyEvents.length === 0 && autoHistoryStatus === 'error' && (
                  <div style={{ color: '#F0A0A0', fontSize: 11 }}>
                    {t('couldNotVerifyIndividual', lang)}
                  </div>
                )}
                {rewardOnlyEvents.length === 0 && autoHistoryStatus !== 'error' && autoHistoryStatus !== 'loading' && (
                  <div style={{ color: '#555555', fontSize: 11 }}>
                    {t('noRewardEvents', lang)}
                  </div>
                )}
              </div>
            </>
          )}
        </>
      )}
    </div>
  );

  return (
    <div style={{ minHeight: '100vh', background: '#000000', padding: '32px 20px', display: 'flex', justifyContent: 'center' }}>
      <div style={{ width: '100%', maxWidth: 960 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 28 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{
              width: 36, height: 36, borderRadius: 10, position: 'relative', overflow: 'hidden',
              background: '#5DE09F',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 0 18px rgba(93, 224, 159, 0.4)',
            }}>
              <div style={{ color: '#000000', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <IconLotus size={38} />
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.15 }}>
              <span style={{
                fontFamily: "'Unbounded', sans-serif", fontWeight: 700, fontSize: 15, letterSpacing: '0.01em', textTransform: 'uppercase',
                color: '#5DE09F',
              }}>
                rune.watch
              </span>
              <span style={{ color: '#555555', fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: "'Inter', sans-serif" }}>
                Powered by Maxim
              </span>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, position: 'relative' }}>
            <button
              onClick={() => setLangPickerOpen((v) => !v)}
              style={{
                display: 'flex', alignItems: 'center', gap: 4,
                background: 'transparent', color: '#CCCCCC',
                border: '1px solid #2A2A2A', borderRadius: 8, padding: '6px 12px', fontSize: 11, fontWeight: 600,
                cursor: 'pointer', fontFamily: "'Inter', sans-serif", letterSpacing: '0.03em',
              }}
            >
              {lang.toUpperCase()} <span style={{ fontSize: 8, color: '#8A8A8A' }}>▾</span>
            </button>
            {langPickerOpen && (
              <div style={{
                position: 'absolute', top: '100%', right: 0, marginTop: 6, zIndex: 30,
                background: '#151515', border: '1px solid #2A2A2A', borderRadius: 10,
                padding: 6, maxHeight: 280, overflowY: 'auto', width: 160,
                boxShadow: '0 8px 24px rgba(0,0,0,0.5)',
              }}>
                {LANGUAGE_OPTIONS.map((l) => (
                  <button
                    key={l.code}
                    onClick={() => {
                      setLang(l.code);
                      try { localStorage.setItem('tp_lang', l.code); } catch (e) {}
                      setLangPickerOpen(false);
                    }}
                    style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%',
                      background: lang === l.code ? '#232323' : 'transparent',
                      color: lang === l.code ? '#FFFFFF' : '#AAAAAA',
                      border: 'none', borderRadius: 6, padding: '6px 8px', fontSize: 11,
                      cursor: 'pointer', fontFamily: "'Inter', sans-serif", textAlign: 'left',
                    }}
                  >
                    <span>{l.label}</span>
                    <span style={{ color: '#666666', fontSize: 9.5, textTransform: 'uppercase' }}>{l.code}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        <div style={{ display: 'flex', gap: 8, marginBottom: 10, maxWidth: 420 }}>
          <input
            className="tp-input"
            value={address}
            onChange={(e) => setAddress(e.target.value)}
            onKeyDown={(e) => e.key === 'Enter' && handleAddOrRefreshWallet()}
            placeholder={wallets.length ? t('addAnotherWallet', lang) : 'thor1...'}
            spellCheck={false}
            autoCorrect="off"
            autoCapitalize="off"
            autoComplete="off"
            style={{ flex: 1, minWidth: 0, background: 'transparent', border: '1px solid #1A1A1A', borderRadius: 8, padding: '5px 9px', color: '#666666', fontSize: 10.5, fontFamily: "'JetBrains Mono', 'SF Mono', monospace", letterSpacing: '-0.01em' }}
          />
          <button
            onClick={handleAddOrRefreshWallet}
            disabled={loading || (!address.trim() && !wallets.length)}
            style={{ background: loading ? '#161616' : '#E8E8E8', color: loading ? '#888888' : '#000000', border: 'none', borderRadius: 8, padding: '0 12px', fontWeight: 600, fontSize: 11.5, fontFamily: "'Inter', sans-serif", display: 'flex', alignItems: 'center', gap: 5, cursor: loading || (!address.trim() && !wallets.length) ? 'default' : 'pointer', flexShrink: 0 }}
          >
            {loading ? <IconLoader size={13} /> : <IconSearch size={13} />}
            {loading ? t('loading', lang) : (address.trim() ? t('addWallet', lang) : t('searchWord', lang))}
          </button>
        </div>

        {wallets.length > 0 && (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 10, maxWidth: 420 }}>
            {wallets.map((w) => (
              <div
                key={w}
                style={{
                  display: 'flex', alignItems: 'center', gap: 6,
                  background: '#151515', border: '1px solid #262626', borderRadius: 6,
                  padding: '4px 6px 4px 10px', fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: '#8A8A8A',
                }}
              >
                <span>{w.slice(0, 8)}…{w.slice(-5)}</span>
                <button
                  onClick={() => removeWallet(w)}
                  title={t('removeWallet', lang)}
                  style={{ background: 'transparent', border: 'none', color: '#666666', cursor: 'pointer', fontSize: 13, lineHeight: 1, padding: '0 2px' }}
                >
                  ×
                </button>
              </div>
            ))}
          </div>
        )}

        {priceRowBox && (
          <div className="tp-price-top" style={{ marginTop: 10, marginBottom: 20 }}>
            {priceRowBox}
          </div>
        )}

        {error && (
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, background: '#1F0F0F', border: '1px solid #4A2A2A', borderRadius: 10, padding: '12px 14px', marginBottom: 24, color: '#F0A0A0', fontSize: 13 }}>
            <IconAlert />
            <span>{error}</span>
          </div>
        )}

        {!hasData && !loading && !error && (
          <div style={{ border: '1px dashed #2A2A2A', borderRadius: 14, padding: '40px 20px', textAlign: 'center', color: '#8A8A8A', fontSize: 13 }}>
            {t('enterAddressPrompt', lang)}
          </div>
        )}

        {!hasData && nodeRewardsBox && (
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 20 }}>
            <div style={{ flex: '1 1 240px', maxWidth: 300, minWidth: 240 }}>
              {nodeRewardsBox}
            </div>
          </div>
        )}

        {hasData && (
          <React.Fragment>
          <div className="tp-mobile-tabs" style={{ gap: 8, marginBottom: 12 }}>
            <button
              onClick={() => setMobileTab('chart')}
              style={{ flex: 1, minWidth: 0, background: mobileTab === 'chart' ? '#1A1A1A' : 'transparent', color: mobileTab === 'chart' ? '#FFFFFF' : '#8A8A8A', border: `1px solid ${mobileTab === 'chart' ? '#3A3A3A' : '#2A2A2A'}`, borderRadius: 8, padding: '8px 6px', fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: "'Inter', sans-serif", whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}
            >
              {t('chartTab', lang)}
            </button>
            <button
              onClick={() => setMobileTab('details')}
              style={{ flex: 1, minWidth: 0, background: mobileTab === 'details' ? '#1A1A1A' : 'transparent', color: mobileTab === 'details' ? '#FFFFFF' : '#8A8A8A', border: `1px solid ${mobileTab === 'details' ? '#3A3A3A' : '#2A2A2A'}`, borderRadius: 8, padding: '8px 6px', fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: "'Inter', sans-serif", whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}
            >
              {t('detailsTab', lang)}
            </button>
          </div>
          <div
            className="tp-content-row"
            style={{ display: 'flex', gap: 20, alignItems: 'flex-start', flexWrap: 'wrap' }}
            onTouchStart={handleContentTouchStart}
            onTouchEnd={handleContentTouchEnd}
          >
          <div className={`tp-chart-panel ${mobileTab === 'chart' ? 'tp-panel-active' : ''}`} style={{ flex: '1 1 420px', minWidth: 0, maxWidth: 640 }}>
            <div className="tp-main-card" style={{ ...cardShellStyle, padding: '22px 24px 22px', marginBottom: 20, position: 'relative', overflow: 'hidden' }}>
              <div className="tp-flow" style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2 }} />

              {/* Kopfzeile: Label + Icon links, Aktionen rechts */}
              <div className="tp-main-card-header" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 18 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ color: '#A0A0A0', fontSize: 12, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
                    {t('portfolioValue', lang)}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0, position: 'relative' }}>
                  <button
                    onClick={() => setCurrencyPickerOpen((v) => !v)}
                    title={t('changeCurrency', lang)}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 4,
                      background: 'transparent', color: '#CCCCCC',
                      border: '1px solid #2A2A2A', borderRadius: 7, padding: '5px 10px', fontSize: 10.5, fontWeight: 700,
                      cursor: 'pointer', fontFamily: "'Inter', sans-serif", textTransform: 'uppercase',
                    }}
                  >
                    {currency} <span style={{ fontSize: 8, color: '#8A8A8A' }}>▾</span>
                  </button>
                  {currencyPickerOpen && (
                    <div style={{
                      position: 'absolute', top: '100%', right: 0, marginTop: 6, zIndex: 30,
                      background: '#151515', border: '1px solid #2A2A2A', borderRadius: 10,
                      padding: 6, maxHeight: 260, overflowY: 'auto', width: 180,
                      boxShadow: '0 8px 24px rgba(0,0,0,0.5)',
                    }}>
                      {CURRENCY_OPTIONS.map((c) => (
                        <button
                          key={c.code}
                          onClick={() => {
                            setCurrency(c.code);
                            try { localStorage.setItem('tp_currency', c.code); } catch (e) {}
                            setCurrencyPickerOpen(false);
                          }}
                          style={{
                            display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%',
                            background: currency === c.code ? '#232323' : 'transparent',
                            color: currency === c.code ? '#FFFFFF' : '#AAAAAA',
                            border: 'none', borderRadius: 6, padding: '6px 8px', fontSize: 11,
                            cursor: 'pointer', fontFamily: "'Inter', sans-serif", textAlign: 'left',
                          }}
                        >
                          <span>{c.code.toUpperCase()}</span>
                          <span style={{ color: '#666666', fontSize: 10 }}>{c.symbol}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
                  <button
                    onClick={() => setHideValue((v) => !v)}
                    title={hideValue ? t('showValues', lang) : t('hideValues', lang)}
                    style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: 'transparent', border: '1px solid #2A2A2A', borderRadius: 7,
                      width: 30, height: 30, color: '#8A8A8A', cursor: 'pointer',
                    }}
                  >
                    {hideValue ? <IconEyeOff /> : <IconEye />}
                  </button>
                  <button
                    onClick={() => fetchPortfolio()}
                    disabled={loading}
                    title={t('refreshWord', lang)}
                    style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      background: 'transparent', border: '1px solid #2A2A2A', borderRadius: 7,
                      width: 30, height: 30, color: '#8A8A8A',
                      cursor: loading ? 'default' : 'pointer',
                    }}
                  >
                    <span style={{ display: 'flex', animation: loading ? 'spin 0.8s linear infinite' : 'none' }}>
                      <IconRefresh size={13} />
                    </span>
                  </button>
                </div>
              </div>

              {/* Hauptwert */}
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap', marginBottom: 8 }}>
                <div style={{ color: '#FFFFFF', fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 40, lineHeight: 1.1, letterSpacing: '-0.01em' }}>
                  {hideValue ? '••••••' : fmtUSD(currentValue, lang, currency)}
                </div>
              </div>

              {/* Performance-Zeile */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginBottom: 18 }}>
                {rangeChangePct != null && (
                  <span style={{
                    display: 'flex', alignItems: 'center', gap: 5,
                    color: isPositive ? '#8FE0AC' : '#F0A0A0',
                    background: isPositive ? 'rgba(143,224,172,0.1)' : 'rgba(240,160,160,0.1)',
                    border: `1px solid ${isPositive ? 'rgba(143,224,172,0.25)' : 'rgba(240,160,160,0.25)'}`,
                    borderRadius: 999, padding: '4px 10px 4px 8px',
                    fontSize: 12.5, fontWeight: 700,
                  }}>
                    {isPositive ? <IconUp size={12} /> : <IconDown size={12} />}
                    {isPositive ? '+' : ''}{rangeChangePct.toFixed(2)}%
                  </span>
                )}
                <span style={{ color: '#777777', fontSize: 12 }}>
                  {rangeLabel(range, lang)}

              </div>

              {bonded === null && (
                <div style={{ color: '#8A8A8A', fontSize: 11, marginTop: 10 }}>
                  {t('bondedNoteBefore', lang)} <IconRuneR size={4} gradientId="runeRGradNote" /> {t('bondedNoteAfter', lang)}
                </div>
              )}
              {totalRune != null && (
                <div className="tp-totals-row" style={{ display: 'flex', gap: 10, paddingTop: 16, borderTop: '1px solid #232323' }}>
                  <div style={{ flex: 1, background: '#151515', border: '1px solid #262626', borderRadius: 12, padding: '10px 14px' }}>
                    <div style={{ color: '#8A8A8A', fontSize: 10.5, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.03em', marginBottom: 4 }}>
                      {t('totalRuneWord', lang)}
                    </div>
                    <div style={{ color: '#F5F5F5', fontSize: 15, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif", display: 'flex', alignItems: 'center', gap: 5 }}>
                      {hideValue ? '••••' : fmtRune(totalRune, lang)}<IconRuneR size={5} gradientId="runeRGradTotalTile" />
                    </div>
                  </div>
                  {bonded != null && bonded > 0 && (
                    <div style={{ flex: 1, background: '#151515', border: '1px solid #262626', borderRadius: 12, padding: '10px 14px' }}>
                      <div style={{ color: '#8A8A8A', fontSize: 10.5, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.03em', marginBottom: 4 }}>
                        Bonded
                      </div>
                      <div style={{ color: '#F5F5F5', fontSize: 15, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif", display: 'flex', alignItems: 'center', gap: 5 }}>
                        {hideValue ? '••••' : fmtRune(bonded, lang)}<IconRuneR size={5} gradientId="runeRGradBondedTile" />
                      </div>
                    </div>
                  )}
                  <MiniRuneChart
                    data={runeChart4h}
                    lang={lang}
                    currency={currency}
                    compact
                    className="tp-mini-chart-tile"
                    onExpand={() => setShowRuneChartModal(true)}
                  />
                </div>
              )}
              {lastUpdated && (
                <div style={{ color: '#555555', fontSize: 11, marginTop: 14, display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span>
                    {t('lastUpdated', lang)}
                    {lastUpdated.toLocaleTimeString(localeFor(lang), { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                  </span>
                  {liveConnected && (
                    <span style={{ display: 'flex', alignItems: 'center', gap: 4, color: '#3DDC84' }}>
                      <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#3DDC84', animation: 'pulse 1.6s ease-in-out infinite' }} />
                      {t('liveWord', lang)}
                    </span>
                  )}
                </div>
              )}
            </div>

            <div className="tp-range-row" style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
              {RANGES.map((r) => (
                <button
                  key={r.days}
                  className="tp-range-btn"
                  onClick={() => setRange(r.days)}
                  style={{ background: range === r.days ? '#1A1A1A' : 'transparent', color: range === r.days ? '#FFFFFF' : '#8A8A8A', border: `1px solid ${range === r.days ? '#3A3A3A' : '#2A2A2A'}`, borderRadius: 8, padding: '6px 14px', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: "'Inter', sans-serif" }}
                >
                  {rangeLabel(r.days, lang)}
                </button>
              ))}
            </div>

            <div className="tp-chart-card" style={{ background: '#0D0D0D', border: '1px solid #2A2A2A', borderRadius: 16, padding: '16px 8px 8px' }}>
              <PortfolioChart
                data={filteredHistory}
                hideValues={hideValue}
                lang={lang}
                currency={currency}
                height={typeof window !== 'undefined' && window.innerWidth < 640 ? 190 : 240}
              />
            </div>
          </div>

          {(volume24h != null || (bonded != null && bonded > 0) || altPrice != null || hasAnyNodeRewardsData) && (
            <div className={`tp-sidebar-col tp-details-panel ${mobileTab === 'details' ? 'tp-panel-active' : ''}`} style={{ flex: '1 1 240px', maxWidth: 300, minWidth: 240, display: 'flex', flexDirection: 'column', gap: 20 }}>
              {priceRowBox && (
                <div className="tp-price-sidebar">
                  {priceRowBox}
                </div>
              )}
              {nodeRewardsBox}
              {volume24h != null && (
                <div className="tp-side-card" style={{ ...cardShellStyle, padding: '18px 20px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                    <div style={{ color: '#A0A0A0', fontSize: 11.5, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
                      {t('volume24h', lang)}
                    </div>
                  </div>
                  <div style={{ color: '#FFFFFF', fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 24, lineHeight: 1.2 }}>
                    {fmtUSDCompact(volume24h * (activePrice || 0), lang, currency)}
                  </div>
                  <VolumeSparkline data={volumeHistory} activePrice={activePrice} lang={lang} currency={currency} />
                </div>
              )}
            </div>
          )}
          </div>
          </React.Fragment>
        )}

        {showRuneChartModal && (
          <RuneChartModal
            lang={lang}
            currency={currency}
            fetchKlines={fetchRuneKlines}
            initialData={runeChart4h}
            initialRangeKey="1D"
            onClose={() => setShowRuneChartModal(false)}
          />
        )}

        <div className="tp-footer" style={{ marginTop: 40, paddingTop: 20, borderTop: '1px solid #1A1A1A', textAlign: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, flexWrap: 'wrap' }}>
            <a
              href="https://thordex.eth.limo/?ref=maxim"
              target="_blank"
              rel="noopener noreferrer"
              style={{
                color: '#0A0A0A', fontSize: 12.5, fontWeight: 700, textDecoration: 'none',
                display: 'inline-flex', alignItems: 'center', gap: 7,
                background: 'linear-gradient(135deg, #5DE09F, #3DE0C4)',
                padding: '9px 18px', borderRadius: 999,
                boxShadow: '0 0 0 rgba(93, 224, 159, 0)',
                transition: 'box-shadow 0.2s, transform 0.2s',
              }}
              onMouseOver={(e) => { e.currentTarget.style.boxShadow = '0 0 18px rgba(93, 224, 159, 0.55)'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
              onMouseOut={(e) => { e.currentTarget.style.boxShadow = '0 0 0 rgba(93, 224, 159, 0)'; e.currentTarget.style.transform = 'none'; }}
            >
              <IconSwapArrows size={14} />
              {t('swapHere', lang)}
            </a>
            <a
              href="https://x.com/runemaxim?s=11"
              target="_blank"
              rel="noopener noreferrer"
              style={{
                color: '#FFFFFF', fontSize: 12.5, fontWeight: 700, textDecoration: 'none',
                display: 'inline-flex', alignItems: 'center', gap: 7,
                background: '#1A1A1A', border: '1px solid #333333',
                padding: '9px 18px', borderRadius: 999,
                boxShadow: '0 0 0 rgba(255, 255, 255, 0)',
                transition: 'box-shadow 0.2s, border-color 0.2s, transform 0.2s',
              }}
              onMouseOver={(e) => { e.currentTarget.style.boxShadow = '0 0 14px rgba(255, 255, 255, 0.25)'; e.currentTarget.style.borderColor = '#666666'; e.currentTarget.style.transform = 'translateY(-1px)'; }}
              onMouseOut={(e) => { e.currentTarget.style.boxShadow = '0 0 0 rgba(255, 255, 255, 0)'; e.currentTarget.style.borderColor = '#333333'; e.currentTarget.style.transform = 'none'; }}
            >
              <IconX size={13} />
              @runemaxim
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ThorchainPortfolio />);
</script>
</body>
</html>
