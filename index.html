const fmtUSD = (n, lang, currency) =>
  n == null ? '—' : n.toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), maximumFractionDigits: 2 });

// Gerundet auf ganze Zahl, ohne Nachkommastellen (z.B. für große Volumen-Zahlen).
const fmtUSDRounded = (n, lang, currency) =>
  n == null ? '—' : Math.round(n).toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), minimumFractionDigits: 0, maximumFractionDigits: 0 });

// Extrem gerundete, kompakte Darstellung großer Beträge, z.B. "22,2 Mio. $" -> hier als "22,2M".
// Nutzt K/M/B-Suffixe mit einer Nachkommastelle statt der vollen Zahl.
const fmtUSDCompact = (n, lang, currency) => {
  if (n == null) return '—';
  const symbol = getCurrencySymbol((currency || 'usd').toLowerCase());
  const abs = Math.abs(n);
  const locale = localeFor(lang);
  let value, suffix;
  if (abs >= 1e9) { value = n / 1e9; suffix = 'B'; }
  else if (abs >= 1e6) { value = n / 1e6; suffix = 'M'; }
  else if (abs >= 1e3) { value = n / 1e3; suffix = 'K'; }
  else { value = n; suffix = ''; }
  const formatted = value.toLocaleString(locale, { minimumFractionDigits: suffix ? 1 : 0, maximumFractionDigits: suffix ? 1 : 0 });
  return `${symbol}${formatted}${suffix}`;
};

// Für den RUNE-Preis selbst (z.B. "$1.234 / RUNE") — 3 statt 2 Nachkommastellen,
// da RUNE oft im niedrigen Dollarbereich liegt und mehr Präzision hier hilfreich ist.
const fmtUSDPrecise = (n, lang, currency) =>
  n == null ? '—' : n.toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), minimumFractionDigits: 3, maximumFractionDigits: 3 });

const TIME_UNIT_LABELS = {
  de: { d: 'T', h: 'Std', m: 'Min', now: 'jeden Moment' }, en: { d: 'd', h: 'h', m: 'm', now: 'any moment' },
  es: { d: 'd', h: 'h', m: 'm', now: 'en cualquier momento' }, fr: { d: 'j', h: 'h', m: 'min', now: "d'un moment à l'autre" },
  it: { d: 'g', h: 'h', m: 'min', now: 'da un momento all\'altro' }, pt: { d: 'd', h: 'h', m: 'min', now: 'a qualquer momento' },
  ja: { d: '日', h: '時間', m: '分', now: 'まもなく' }, zh: { d: '天', h: '小时', m: '分钟', now: '随时' },
  ru: { d: 'д', h: 'ч', m: 'мин', now: 'с минуты на минуту' }, ko: { d: '일', h: '시간', m: '분', now: '곧' },
};
const fmtCountdown = (targetMs, lang) => {
  const u = TIME_UNIT_LABELS[lang] || TIME_UNIT_LABELS.en;
  const ms = targetMs - Date.now();
  if (ms <= 0) return u.now;
  const totalMinutes = Math.floor(ms / 60000);
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;
  if (days > 0) return `${days}${u.d} ${hours}${u.h}`;
  if (hours > 0) return `${hours}${u.h} ${minutes}${u.m}`;
  return `${minutes}${u.m}`;
};

// Lotusblüte, Proportionen aus Referenzbild vermessen (Winkel 0/±38/±75°,
// Längenverhältnis 1 : 0.94 : 0.82), plus RUNE-"R" als Stempel.
const IconLotus = (p) => {
  const size = p.size || 17;
  const baseX = 12, baseY = 16.58;
  const sw = 0.6;

  const bez = (p0, c1, c2, p1) => `M${p0[0]},${p0[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p1[0]},${p1[1]}`;
  const rot = (x, y, deg) => {
    const a = (deg * Math.PI) / 180;
    return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
  };

  const petal = (angleDeg, length, width, key) => {
    const P = (lx, ly) => {
      const [rx, ry] = rot(lx, ly, angleDeg);
      return [baseX + rx, baseY + ry];
    };
    const p0 = P(0, 0);
    const tip = P(0, -length);
    const c1L = P(-width * 0.55, -length * 0.30);
    const c2L = P(-width * 0.32, -length * 0.76);
    const c1R = P(width * 0.32, -length * 0.76);
    const c2R = P(width * 0.55, -length * 0.30);
    const vein0 = P(0, -length * 0.10);
    const vein1 = P(0, -length * 0.86);
    return (
      <g key={key}>
        <path d={bez(p0, c1L, c2L, tip)} fill="none" />
        <path d={bez(tip, c2R, c1R, p0)} fill="none" />
        <line x1={vein0[0]} y1={vein0[1]} x2={vein1[0]} y2={vein1[1]} strokeWidth={sw * 0.55} />
      </g>
    );
  };

  const L = 13.99;
  const petals = [
    [0, L * 1.00, L * 1.00 * 0.30],
    [-38, L * 0.94, L * 0.94 * 0.36],
    [38, L * 0.94, L * 0.94 * 0.36],
    [-75, L * 0.82, L * 0.82 * 0.44],
    [75, L * 0.82, L * 0.82 * 0.44],
  ];

  // RUNE-"R" als Stempel (statt Spirale) — Originalpfad viewBox 0 0 109 214.
  const rTargetH = 3.56;
  const rScale = rTargetH / 214;
  const rMidX = (13 + 96) / 2, rMidY = 214 / 2;
  const rCx = baseX, rCy = baseY + 3.04;
  const rMap = (x, y) => [rCx + (x - rMidX) * rScale, rCy + (y - rMidY) * rScale];
  const [rx1, ry1] = rMap(13, 0);
  const [rx2, ry2] = rMap(13, 214);
  const [dx1, dy1] = rMap(13, 0);
  const [dx2, dy2] = rMap(82, 58);
  const [dx3, dy3] = rMap(59, 112);
  const [dx4, dy4] = rMap(96, 214);

};

// Echte Coin-Logos direkt von CoinGecko (nicht aus einem veralteten Drittanbieter-Icon-Set —
// das alte Set hatte z.B. Solana nie richtig aufgenommen). Ein einziger Sammel-Request für
// alle unterstützten Coins, modulweit gecacht, damit jede Kachel/jeder Picker-Eintrag densel-
// ben Abruf wiederverwendet. Schlägt das Laden fehl (z.B. offline), fällt automatisch auf die
// handgezeichnete Glyphe zurück, damit nie ein leerer/kaputter Platzhalter zu sehen ist.
let coinImageCache = null; // { [geckoId]: imageUrl }
let coinImageCachePromise = null;
const loadCoinImages = () => {
  if (coinImageCache) return Promise.resolve(coinImageCache);
  if (coinImageCachePromise) return coinImageCachePromise;
  const ids = ['thorchain', ...ALT_COIN_OPTIONS.map((c) => c.geckoId)].join(',');
  coinImageCachePromise = fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`)
    .then((res) => (res.ok ? res.json() : []))
    .then((list) => {
      const map = {};
      (list || []).forEach((c) => { if (c && c.id && c.image) map[c.id] = c.image; });
      coinImageCache = map;
      return map;
    })
    .catch(() => {
      coinImageCache = {};
      return {};
    });
  return coinImageCachePromise;
};

const CoinLogo = ({ code, geckoId, size = 15, glyph }) => {
  const [imgUrl, setImgUrl] = useState(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    let cancelled = false;
    loadCoinImages().then((map) => {
      if (cancelled) return;
      if (map[geckoId]) setImgUrl(map[geckoId]);
      else setFailed(true);
    });
    return () => { cancelled = true; };
  }, [geckoId]);

  if (failed || !imgUrl) {
    if (glyph === 'RUNE') {
      return <IconRuneR size={size * 0.55} solid="#0A0A0A" />;
    }
    return <IconCoinGlyph symbol={glyph} size={size} />;
  }
  return (
    <img
      src={imgUrl}
      width={size} height={size}
      style={{ display: 'block', borderRadius: '50%' }}
      onError={() => setFailed(true)}
      alt={code}
    />
  );
};

// --- Simple custom SVG area chart with drawing tools (horizontal + free line) ---
// Wandelt eine Punktreihe in einen weichen, gerundeten SVG-Pfad um (statt scharfer
// Geraden zwischen den Punkten) -- verhindert vor allem bei sehr dichten/spitzen
// Live-Daten (z.B. 1H-Sekundenchart) den "blockigen" Treppen-Look.
function smoothPath(points) {
  if (points.length < 2) return '';
  if (points.length === 2) return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i === 0 ? 0 : i - 1];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2 < points.length ? i + 2 : i + 1];
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}

function PortfolioChart({ data, hideValues, lang, currency, storageKeyPrefix = 'tp', height = 240, showPriceRow = true, clampMinZero = true, dateFormatter = fmtDate, smooth = false, chartType = 'line' }) {
  const containerRef = useRef(null);
  const svgRef = useRef(null);
  const [width, setWidth] = useState(600);
  const [hover, setHover] = useState(null);

  // Zeichenwerkzeuge
  const [mode, setMode] = useState('pointer'); // 'pointer' | 'horizontal' | 'trend'
  const [hLines, setHLines] = useState(() => {
    try { const raw = localStorage.getItem(storageKeyPrefix + '_hlines'); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
  }); // { id, value }
  const [tLines, setTLines] = useState(() => {
    try { const raw = localStorage.getItem(storageKeyPrefix + '_tlines'); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
  }); // { id, x1,y1,x2,y2 } — Bruchteile 0..1 der Zeichenfläche
  const [pendingStart, setPendingStart] = useState(null); // { xFrac, yFrac }
  const [mousePixel, setMousePixel] = useState(null);
  const [dragging, setDragging] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);

  // Rechter Rand wird größer, sobald mindestens eine horizontale Linie existiert — damit deren
  // Preis-Beschriftung in einer eigenen Spalte neben dem Chart Platz hat, statt auf der Kurve
  // selbst zu kleben und die Daten zu verdecken.
  const padding = { top: 16, right: hLines.length > 0 ? 74 : 16, bottom: 28, left: 64 };

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) setWidth(entry.contentRect.width);
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Zeichnungen (horizontale Linien & Trendlinien) persistent speichern, damit sie nach einem Reload erhalten bleiben.
  useEffect(() => {
    try { localStorage.setItem(storageKeyPrefix + '_hlines', JSON.stringify(hLines)); } catch (e) {}
  }, [hLines, storageKeyPrefix]);

  useEffect(() => {
    try { localStorage.setItem(storageKeyPrefix + '_tlines', JSON.stringify(tLines)); } catch (e) {}
  }, [tLines, storageKeyPrefix]);

  if (!data || data.length < 2) {
    return <div ref={containerRef} style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#8A8A8A', fontSize: 13 }}>{t('notEnoughData', lang)}</div>;
  }

  const innerW = Math.max(width - padding.left - padding.right, 10);
  const innerH = height - padding.top - padding.bottom;

  const isCandles = chartType === 'candles';
  const xs = data.map(d => d.date);
  const ys = isCandles ? data.flatMap(d => [d.high != null ? d.high : d.value, d.low != null ? d.low : d.value]) : data.map(d => d.value);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yPad = (yMax - yMin) * 0.1 || yMax * 0.1 || 1;
  const yLo = clampMinZero ? Math.max(0, yMin - yPad) : yMin - yPad, yHi = yMax + yPad;

  const xScale = (x) => padding.left + ((x - xMin) / (xMax - xMin || 1)) * innerW;
  const yScale = (y) => padding.top + innerH - ((y - yLo) / (yHi - yLo || 1)) * innerH;
  const invYScale = (py) => yLo + (1 - (py - padding.top) / innerH) * (yHi - yLo);

  const toFrac = (pt) => ({ xFrac: (pt.x - padding.left) / innerW, yFrac: (pt.y - padding.top) / innerH });
  const fromFrac = (f) => ({ x: padding.left + f.xFrac * innerW, y: padding.top + f.yFrac * innerH });
  const getLocalPoint = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };

  const chartPoints = data.map(d => ({ x: xScale(d.date), y: yScale(d.value) }));
  const straightLinePath = chartPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const smoothLinePath = smooth ? smoothPath(chartPoints) : straightLinePath;
  const smoothAreaPath = chartPoints.length
    ? `${smoothLinePath} L ${chartPoints[chartPoints.length - 1].x},${padding.top + innerH} L ${chartPoints[0].x},${padding.top + innerH} Z`
    : '';

  // Kerzen-Geometrie: Breite aus dem Punktabstand ableiten, Docht = High/Low, Körper = Open/Close.
  const candleSlotW = data.length > 1 ? innerW / data.length : innerW;
  const candleBodyW = Math.max(1, Math.min(candleSlotW * 0.7, 10));
  const candles = isCandles ? data.map((d) => {
    const cx = xScale(d.date);
    const o = d.open != null ? d.open : d.value;
    const c = d.value;
    const h = d.high != null ? d.high : Math.max(o, c);
    const l = d.low != null ? d.low : Math.min(o, c);
    const up = c >= o;
    return {
      x: cx,
      wickTop: yScale(h),
      wickBottom: yScale(l),
      bodyTop: yScale(Math.max(o, c)),
      bodyBottom: yScale(Math.min(o, c)),
      up,
    };
  }) : [];

  const yTicks = 4;
  const yTickVals = Array.from({ length: yTicks + 1 }, (_, i) => yLo + (i * (yHi - yLo)) / yTicks);
  // Nachkommastellen für die Achsenbeschriftung an die Tick-Abstände anpassen — sonst
  // rundet z.B. ein RUNE-Preis um $0.40 bei jedem Tick auf "$0" und die Achse wirkt sinnlos.
  const yTickStep = (yHi - yLo) / yTicks || 1;
  const yTickDecimals = yTickStep >= 1 ? 0 : yTickStep >= 0.1 ? 2 : yTickStep >= 0.01 ? 3 : 4;

  // Anzahl der x-Achsen-Beschriftungen an die verfügbare Breite anpassen, statt immer fix 6 zu
  // zeigen — auf schmalen (Handy-)Bildschirmen quetschen sich sonst z.B. Uhrzeiten wie
  // "10:43:46 AM" im 4H-Chart ineinander. Uhrzeiten brauchen mehr Platz pro Label als Daten.
  const isTimeFormat = dateFormatter === fmtTime;
  const minLabelSpacing = isTimeFormat ? 92 : 64;
  const maxTicksByWidth = Math.max(2, Math.floor(innerW / minLabelSpacing));
  const xTickCount = Math.min(6, maxTicksByWidth, data.length);
  const xTickVals = Array.from({ length: xTickCount }, (_, i) => xMin + (i * (xMax - xMin)) / (xTickCount - 1 || 1));

  const handleSvgMouseMove = (e) => {
    const pt = getLocalPoint(e);
    setMousePixel(pt);
    if (mode === 'pointer' && !dragging) {
      const targetX = xMin + ((pt.x - padding.left) / innerW) * (xMax - xMin);
      let closest = data[0];
      let minDiff = Infinity;
      for (const d of data) {
        const diff = Math.abs(d.date - targetX);
        if (diff < minDiff) { minDiff = diff; closest = d; }
      }
      setHover(closest);
    } else {
      setHover(null);
    }
  };

  const handleSvgClick = (e) => {
    if (dragging) return;
    const pt = getLocalPoint(e);
    if (mode === 'horizontal') {
      const value = invYScale(pt.y);
      setHLines(prev => [...prev, { id: 'h' + Date.now() + Math.random(), value }]);
      setMode('pointer');
    } else if (mode === 'trend') {
      const f = toFrac(pt);
      if (!pendingStart) {
        setPendingStart(f);
      } else {
        setTLines(prev => [...prev, { id: 't' + Date.now() + Math.random(), x1: pendingStart.xFrac, y1: pendingStart.yFrac, x2: f.xFrac, y2: f.yFrac }]);
        setPendingStart(null);
        setMode('pointer');
      }
    } else {
      setHoveredId(null); // Tap auf leere Fläche: Auswahl/Löschen-Button ausblenden
    }
  };

  // Globale Listener während des Ziehens einer Linie
  useEffect(() => {
    if (!dragging) return;
    const onMove = (e) => {
      const pt = getLocalPoint(e);
      if (dragging.type === 'h') {
        const value = invYScale(pt.y);
        setHLines(prev => prev.map(l => (l.id === dragging.id ? { ...l, value } : l)));
      } else if (dragging.type === 'tpoint') {
        const f = toFrac(pt);
        setTLines(prev => prev.map(l => {
          if (l.id !== dragging.id) return l;
          return dragging.which === 1 ? { ...l, x1: f.xFrac, y1: f.yFrac } : { ...l, x2: f.xFrac, y2: f.yFrac };
        }));
      } else if (dragging.type === 'tline') {
        const f = toFrac(pt);
        const dx = f.xFrac - dragging.startFrac.xFrac;
        const dy = f.yFrac - dragging.startFrac.yFrac;
        setTLines(prev => prev.map(l => (l.id === dragging.id
          ? { ...l, x1: dragging.orig.x1 + dx, y1: dragging.orig.y1 + dy, x2: dragging.orig.x2 + dx, y2: dragging.orig.y2 + dy }
          : l)));
      }
    };
    const onUp = () => setDragging(null);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, [dragging]);

  const showCrosshair = hover && mode === 'pointer' && !dragging;

  return (
    <div ref={containerRef} style={{ position: 'relative', width: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10, paddingLeft: 2, flexWrap: 'wrap' }}>
        <button title={t('toolSelect', lang)} onClick={() => { setMode('pointer'); setPendingStart(null); }} style={toolBtnStyle(mode === 'pointer')}>
          <IconPointer size={17} />
        </button>
        <button title={t('toolHLine', lang)} onClick={() => { setMode('horizontal'); setPendingStart(null); }} style={toolBtnStyle(mode === 'horizontal')}>
          <IconHLine size={17} />
        </button>
        <button title={t('toolTrend', lang)} onClick={() => { setMode('trend'); setPendingStart(null); }} style={toolBtnStyle(mode === 'trend')}>
          <IconTrendLine size={17} />
        </button>
        {(hLines.length > 0 || tLines.length > 0) && (
          <button
            title={hoveredId
              ? (t('deleteSelectedDrawing', lang))
              : (t('tapDrawingFirst', lang))}
            onClick={() => {
              if (hoveredId) {
                setHLines((prev) => prev.filter((x) => x.id !== hoveredId));
                setTLines((prev) => prev.filter((x) => x.id !== hoveredId));
                setHoveredId(null);
              }
            }}
            style={{ ...toolBtnStyle(false), opacity: hoveredId ? 1 : 0.4, cursor: hoveredId ? 'pointer' : 'default' }}
          >
            <IconTrash size={17} />
          </button>
        )}
        {mode !== 'pointer' && (
          <span style={{ color: '#8A8A8A', fontSize: 11, marginLeft: 4 }}>
            {mode === 'horizontal'
              ? (t('tapChartPlaceLine', lang))
              : (pendingStart
                  ? (t('tapEndPoint', lang))
                  : (t('tapStartPoint', lang)))}
          </span>
        )}
      </div>

      <svg
        ref={svgRef}
        width={width}
        height={height}
        onPointerMove={handleSvgMouseMove}
        onPointerLeave={() => { setHover(null); setMousePixel(null); }}
        onClick={handleSvgClick}
        style={{ display: 'block', cursor: mode === 'pointer' ? 'default' : 'crosshair', touchAction: mode === 'pointer' ? 'auto' : 'none' }}
      >
        <defs>
          <linearGradient id="tpGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
          </linearGradient>
        </defs>
        {yTickVals.map((v, i) => (
          <g key={i}>
            <line x1={padding.left} x2={width - padding.right} y1={yScale(v)} y2={yScale(v)} stroke="#1A1A1A" strokeDasharray="3 3" />
            <text x={padding.left - 10} y={yScale(v) + 4} textAnchor="end" fontSize="11" fill="#8A8A8A" fontFamily="Inter, sans-serif">
              {hideValues ? '••••' : `${getCurrencySymbol(currency)}${v.toLocaleString(localeFor(lang), { minimumFractionDigits: yTickDecimals, maximumFractionDigits: yTickDecimals })}`}
            </text>
          </g>
        ))}
        {xTickVals.map((v, i) => (
          <text key={i} x={xScale(v)} y={height - 8} textAnchor="middle" fontSize="11" fill="#8A8A8A" fontFamily="Inter, sans-serif">
            {dateFormatter(v, lang)}
          </text>
        ))}
        {isCandles ? (
          <g>
            {candles.map((c, i) => (
              <g key={i}>
                <line x1={c.x} x2={c.x} y1={c.wickTop} y2={c.wickBottom} stroke={c.up ? '#8FE0AC' : '#F0A0A0'} strokeWidth="1" />
                <rect
                  x={c.x - candleBodyW / 2}
                  y={c.bodyTop}
                  width={candleBodyW}
                  height={Math.max(1, c.bodyBottom - c.bodyTop)}
                  fill={c.up ? '#8FE0AC' : '#F0A0A0'}
                />
              </g>
            ))}
          </g>
        ) : (
          <React.Fragment>
            <path d={smoothAreaPath} fill="url(#tpGrad)" stroke="none" />
            <path d={smoothLinePath} fill="none" stroke="#FFFFFF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
          </React.Fragment>
        )}

        {/* Horizontale Linien */}
        {hLines.map((l) => {
          const y = yScale(l.value);
          return (
            <g key={l.id} onMouseEnter={() => setHoveredId(l.id)} onMouseLeave={() => setHoveredId((id) => (id === l.id ? null : id))}>
              <line
                x1={padding.left} x2={padding.left + innerW} y1={y} y2={y}
                stroke="transparent" strokeWidth="40" style={{ cursor: 'ns-resize', touchAction: 'none' }}
                onPointerDown={(e) => { e.stopPropagation(); setHoveredId(l.id); setDragging({ type: 'h', id: l.id }); }}
              />
              <line x1={padding.left} x2={padding.left + innerW} y1={y} y2={y} stroke="#FFFFFF" strokeWidth="1.5" pointerEvents="none" opacity="0.9" />
              {(() => {
                const label = hideValues ? '••••' : `${getCurrencySymbol(currency)}${l.value.toLocaleString(localeFor(lang), { minimumFractionDigits: yTickDecimals, maximumFractionDigits: yTickDecimals })}`;
                const boxW = Math.min(label.length * 6.4 + 12, padding.right - 6);
                const boxH = 18;
                const bx = padding.left + innerW + 4;
                const by = Math.min(height - padding.bottom - boxH, Math.max(padding.top, y - boxH / 2));
                return (
                  <g pointerEvents="none">
                    <line x1={padding.left + innerW} x2={bx} y1={y} y2={by + boxH / 2} stroke="#3A3A3A" strokeWidth="1" strokeDasharray="2 2" />
                    <rect x={bx} y={by} width={boxW} height={boxH} rx={4} fill="#000000" stroke="#3A3A3A" strokeWidth="1" />
                    <text x={bx + boxW / 2} y={by + boxH / 2 + 4} textAnchor="middle" fontSize="10.5" fill="#F5F5F5" fontFamily="Inter, sans-serif">
                      {label}
                    </text>
                  </g>
                );
              })()}
              {hoveredId === l.id && (
                <g style={{ cursor: 'pointer' }} onClick={(e) => { e.stopPropagation(); setHLines((prev) => prev.filter((x) => x.id !== l.id)); }}>
                  <circle cx={padding.left + 18} cy={y} r="14" fill="#000000" stroke="#FFFFFF" strokeWidth="1" />
                  <text x={padding.left + 18} y={y + 4} textAnchor="middle" fontSize="14" fill="#FFFFFF">×</text>
                </g>
              )}
            </g>
          );
        })}

        {/* Freie Linien (Trendlinien) */}
        {tLines.map((l) => {
          const p1 = fromFrac({ xFrac: l.x1, yFrac: l.y1 });
          const p2 = fromFrac({ xFrac: l.x2, yFrac: l.y2 });
          const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
          return (
            <g key={l.id} onMouseEnter={() => setHoveredId(l.id)} onMouseLeave={() => setHoveredId((id) => (id === l.id ? null : id))}>
              <line
                x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                stroke="transparent" strokeWidth="40" style={{ cursor: 'move', touchAction: 'none' }}
                onPointerDown={(e) => {
                  e.stopPropagation();
                  setHoveredId(l.id);
                  const pt = getLocalPoint(e);
                  const f = toFrac(pt);
                  setDragging({ type: 'tline', id: l.id, startFrac: f, orig: { x1: l.x1, y1: l.y1, x2: l.x2, y2: l.y2 } });
                }}
              />
              <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="#FFFFFF" strokeWidth="1.5" pointerEvents="none" />
              {hoveredId === l.id && (
                <React.Fragment>
                  <circle
                    cx={p1.x} cy={p1.y} r="15" fill="#000000" stroke="#FFFFFF" strokeWidth="1.5" style={{ cursor: 'grab', touchAction: 'none' }}
                    onPointerDown={(e) => { e.stopPropagation(); setHoveredId(l.id); setDragging({ type: 'tpoint', id: l.id, which: 1 }); }}
                  />
                  <circle
                    cx={p2.x} cy={p2.y} r="15" fill="#000000" stroke="#FFFFFF" strokeWidth="1.5" style={{ cursor: 'grab', touchAction: 'none' }}
                    onPointerDown={(e) => { e.stopPropagation(); setHoveredId(l.id); setDragging({ type: 'tpoint', id: l.id, which: 2 }); }}
                  />
                </React.Fragment>
              )}
              {hoveredId === l.id && (
                <g style={{ cursor: 'pointer' }} onClick={(e) => { e.stopPropagation(); setTLines((prev) => prev.filter((x) => x.id !== l.id)); }}>
                  <circle cx={midX} cy={midY} r="14" fill="#000000" stroke="#FFFFFF" strokeWidth="1" />
                  <text x={midX} y={midY + 4} textAnchor="middle" fontSize="14" fill="#FFFFFF">×</text>
                </g>
              )}
            </g>
          );
        })}

        {/* Vorschau während des Setzens der freien Linie */}
        {mode === 'trend' && pendingStart && mousePixel && (
          <line
            x1={fromFrac(pendingStart).x} y1={fromFrac(pendingStart).y}
            x2={mousePixel.x} y2={mousePixel.y}
            stroke="#FFFFFF" strokeWidth="1.5" pointerEvents="none"
          />
        )}

        {showCrosshair && (
          <g>
            <line x1={xScale(hover.date)} x2={xScale(hover.date)} y1={padding.top} y2={padding.top + innerH} stroke="#3A3A3A" strokeWidth="1" />
            <circle cx={xScale(hover.date)} cy={yScale(hover.value)} r="4" fill="#FFFFFF" stroke="#000000" strokeWidth="2" />
          </g>
        )}
      </svg>
      {showCrosshair && (
        <div style={{
          position: 'absolute',
          left: Math.min(Math.max(xScale(hover.date) - 60, 0), width - 130),
          top: 0,
          background: '#0D0D0D',
          border: '1px solid #333333',
          borderRadius: 10,
          padding: '8px 12px',
          pointerEvents: 'none',
          boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
        }}>
          <div style={{ color: '#999999', fontSize: 11, marginBottom: 2 }}>{dateFormatter(hover.date, lang)}</div>
          <div style={{ color: '#F5F5F5', fontSize: 14, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif" }}>{hideValues ? '••••••' : fmtUSD(hover.value, lang, currency)}</div>
          {showPriceRow && (
            <div style={{ color: '#A8D8B9', fontSize: 11, display: 'flex', alignItems: 'center', gap: 4 }}>
              {fmtUSDPrecise(hover.price, lang, currency)} / <IconRuneR size={4} gradientId="runeRGradTooltip" />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Kleiner Sparkline-Graph für das Tages-Handelsvolumen der letzten 30 Tage.
// Zeigt zusätzlich die letzte Woche (7 Tage) farblich hervorgehoben.
function VolumeSparkline({ data, activePrice, lang, currency }) {
  const width = 240;
  const height = 56;
  const padding = { top: 4, right: 2, bottom: 2, left: 2 };
  const [volRange, setVolRange] = useState(7); // 7 oder 30 Tage — nur eine Periode wird angezeigt

  if (!data || data.length < 2) return null;

  const shown = data.slice(-volRange);
  const values = shown.map((d) => d.volumeRune);
  const maxV = Math.max(...values, 1);
  const minV = 0;
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const xScale = (i) => padding.left + (shown.length > 1 ? (i / (shown.length - 1)) * innerW : innerW / 2);
  const yScale = (v) => padding.top + innerH - ((v - minV) / (maxV - minV || 1)) * innerH;

  const linePath = shown.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(d.volumeRune)}`).join(' ');
  const areaPath = `${linePath} L ${xScale(shown.length - 1)} ${height - padding.bottom} L ${xScale(0)} ${height - padding.bottom} Z`;

  const totalRune = shown.reduce((s, d) => s + d.volumeRune, 0);
  const totalUsd = activePrice != null ? totalRune * activePrice : null;

  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 6, marginBottom: 8 }}>
        {[7, 30].map((r) => (
          <button
            key={r}
            onClick={() => setVolRange(r)}
            style={{
              background: volRange === r ? '#1A1A1A' : 'transparent',
              color: volRange === r ? '#FFFFFF' : '#8A8A8A',
              border: `1px solid ${volRange === r ? '#3A3A3A' : '#2A2A2A'}`,
              borderRadius: 6, padding: '2px 8px', fontSize: 10, fontWeight: 600,
              cursor: 'pointer', fontFamily: "'Inter', sans-serif",
            }}
          >
            {rangeLabel(r, lang)}
          </button>
        ))}
      </div>
      <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: 'block' }}>
        <defs>
          <linearGradient id="volSparkFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.35" />
            <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0" />
          </linearGradient>
        </defs>
        <path d={areaPath} fill="url(#volSparkFill)" stroke="none" />
        <path d={linePath} fill="none" stroke="#FFFFFF" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      </svg>
      <div style={{ marginTop: 8 }}>
        <div style={{ color: '#8A8A8A', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.03em', marginBottom: 2 }}>
          {volRange === 7 ? (t('last7d', lang)) : (t('last30d', lang))}
        </div>
        <div style={{ color: '#F5F5F5', fontSize: 13, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif" }}>
          {totalUsd != null ? fmtUSDRounded(totalUsd, lang, currency) : '—'}
        </div>
      </div>
    </div>
  );
}

// Kleiner, klickbarer RUNE-Preis-Chart (4h) im gleichen Karten-Stil wie die anderen
// Sidebar-Charts. Klick öffnet den großen, zeichenbaren Chart (RuneChartModal).
function MiniRuneChart({ data, lang, currency, onExpand, compact, className }) {
  const width = 240;
  const height = compact ? 44 : 64;
  const padding = compact ? { top: 2, right: 2, bottom: 2, left: 2 } : { top: 6, right: 3, bottom: 3, left: 3 };
  const hasData = data && data.length > 1;

  let linePath = '', areaPath = '', isUp = true, pctChange = null, lastPrice = null;
  if (hasData) {
    const values = data.map((d) => d.value);
    const minV = Math.min(...values), maxV = Math.max(...values);
    const pad = (maxV - minV) * 0.15 || maxV * 0.02 || 0.001;
    const lo = minV - pad, hi = maxV + pad;
    const innerW = width - padding.left - padding.right;
    const innerH = height - padding.top - padding.bottom;
    const xScale = (i) => padding.left + (i / (data.length - 1)) * innerW;
    const yScale = (v) => padding.top + innerH - ((v - lo) / (hi - lo || 1)) * innerH;
    linePath = data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i)} ${yScale(d.value)}`).join(' ');

    pctChange = ((values[values.length - 1] - values[0]) / values[0]) * 100;

          {pctChange != null && (
            <span style={{ color: accent, fontSize: 10.5, fontWeight: 700, whiteSpace: 'nowrap', flexShrink: 0 }}>
              {isUp ? '+' : ''}{pctChange.toFixed(2)}%

          )}
        </div>
        {!hasData ? (
          <div style={{ color: '#666666', fontSize: 12 }}>{t('loading', lang)}</div>

          <React.Fragment>
            <div style={{ color: '#F5F5F5', fontSize: 15, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif", marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {fmtUSDPrecise(lastPrice, lang, currency)}
            </div>
            <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: 'block' }}>
              <defs>
                <linearGradient id="miniRuneFillCompact" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={accent} stopOpacity="0.3" />

            </svg>

  return (
    <button
      onClick={onExpand}
      title={t('tapOpenFullChart', lang)}
      style={{ ...cardShellStyle, padding: '16px 18px', cursor: 'pointer', textAlign: 'left', width: '100%', font: 'inherit', color: 'inherit' }}
    >
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>

          <div style={{ color: '#A0A0A0', fontSize: 11.5, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
            RUNE · 1D
          </div>
        </div>
        {pctChange != null && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, color: accent, fontSize: 11.5, fontWeight: 700 }}>
            {isUp ? '+' : ''}{pctChange.toFixed(2)}%
          </span>
        )}
      </div>
      {!hasData ? (
        <div style={{ height, display: 'flex', alignItems: 'center', color: '#666666', fontSize: 12 }}>
          {t('loading', lang)}
        </div>
      ) : (
        <React.Fragment>
          <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: 'block' }}>
            <defs>
              <linearGradient id="miniRuneFill" x1="0" y1="0" x2="0" y2="1">

                <stop offset="100%" stopColor={accent} stopOpacity="0" />

const CHART_MODAL_RANGES = [
  { key: '4H', label: '4H', interval: '1m', limit: 240, live: true },
  { key: '1D', label: '1D', interval: '5m', limit: 288 },
  { key: '1W', label: '1W', interval: '1h', limit: 168 },
  { key: '1M', label: '1M', interval: '4h', limit: 180 },
  { key: '3M', label: '3M', interval: '1d', limit: 90 },
  { key: '1Y', label: '1Y', interval: '1d', limit: 365 },
];
const LIVE_WINDOW_MS = 4 * 60 * 60 * 1000; // 4H-Chart behält ein rollierendes Fenster von 4 Stunden
const LIVE_TICK_SECONDS = 60; // neue Kerze alle 60 Sekunden (1 Minute)

// Vollbild-Chart mit Zeichenwerkzeugen (ähnlich TradingView) für den RUNE-Preis.
// Wiederverwendet PortfolioChart (gleiche Zeichenmechanik), aber mit eigenen
// LocalStorage-Keys, damit Zeichnungen hier nicht mit dem Portfolio-Wert-Chart kollidieren.
function RuneChartModal({ onClose, lang, currency, fetchKlines, initialRangeKey = '1D', initialData }) {
  const [rangeKey, setRangeKey] = useState(initialRangeKey);
  const [data, setData] = useState(initialData || []);
  const [loadingRange, setLoadingRange] = useState(false);
  const isMobile = typeof window !== 'undefined' && window.innerWidth < 640;
  const isLive = rangeKey === '4H';

  useEffect(() => {
    let cancelled = false;
    const r = CHART_MODAL_RANGES.find((x) => x.key === rangeKey);
    if (!r) return;
    setLoadingRange(true);
    fetchKlines(r.interval, r.limit).then((d) => {
      if (!cancelled && d && d.length > 1) setData(d);
    }).finally(() => { if (!cancelled) setLoadingRange(false); });
    return () => { cancelled = true; };
  }, [rangeKey, fetchKlines]);

  // Live-Takt für den 4H-Chart: holt alle 15 Sekunden die letzten 15 1s-Kerzen und fasst
  // sie zu einer echten 15-Sekunden-Kerze zusammen (Open = erster, Close = letzter,
  // High/Low = Extremwerte), statt nur einen einzelnen Schnappschuss zu nehmen -- so bleibt
  // die Bewegung innerhalb der 15s sichtbar. Fenster bleibt auf 4 Stunden begrenzt.
  useEffect(() => {
    if (!isLive) return;
    let cancelled = false;
    const id = setInterval(() => {
      fetchKlines('1s', LIVE_TICK_SECONDS).then((d) => {
        if (cancelled || !d || !d.length) return;
        const candle = {
          date: d[d.length - 1].date,
          open: d[0].open,
          close: d[d.length - 1].value,
          value: d[d.length - 1].value,
          high: Math.max(...d.map((k) => k.high)),
          low: Math.min(...d.map((k) => k.low)),
        };
        setData((prev) => {
          const cutoff = candle.date - LIVE_WINDOW_MS;
          const last = prev[prev.length - 1];
          const base = last && candle.date - last.date < LIVE_TICK_SECONDS * 1000 ? prev.slice(0, -1) : prev;
          const next = [...base, candle].filter((p) => p.date >= cutoff);
          return next;
        });
      });
    }, LIVE_TICK_SECONDS * 1000);
    return () => { cancelled = true; clearInterval(id); };
  }, [isLive, fetchKlines]);

  useEffect(() => {
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = prevOverflow; window.removeEventListener('keydown', onKey); };
  }, [onClose]);

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', zIndex: 1000,
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: isMobile ? 8 : 24,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: '#0A0A0A', border: '1px solid #262626', borderRadius: 18,
          width: '100%', maxWidth: 920, maxHeight: '92vh', overflow: 'auto',
          padding: isMobile ? 14 : 22, boxShadow: '0 24px 60px rgba(0,0,0,0.6)',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14, gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ color: '#F5F5F5', fontSize: 15, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif" }}>
              RUNE {t('priceWord', lang)}
            </div>
            {isLive && (
              <span style={{ display: 'flex', alignItems: 'center', gap: 4, color: '#3DDC84', fontSize: 11, fontWeight: 700, letterSpacing: '0.03em', textTransform: 'uppercase' }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#3DDC84', animation: 'pulse 1.2s ease-in-out infinite' }} />
                {t('liveWord', lang)}
              </span>
            )}
          </div>
          <button
            onClick={onClose}
            title={t('closeWord', lang)}
            style={{ width: 34, height: 34, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'transparent', color: '#8A8A8A', border: '1px solid #2A2A2A', borderRadius: 9, cursor: 'pointer', fontSize: 16 }}
          >
            ×
          </button>
        </div>

        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {CHART_MODAL_RANGES.map((r) => (
            <button
              key={r.key}
              onClick={() => setRangeKey(r.key)}
              style={{
                background: rangeKey === r.key ? '#1A1A1A' : 'transparent',
                color: rangeKey === r.key ? '#FFFFFF' : '#8A8A8A',
                border: `1px solid ${rangeKey === r.key ? '#3A3A3A' : '#2A2A2A'}`,
                borderRadius: 8, padding: '6px 14px', fontSize: 12, fontWeight: 600,
                cursor: 'pointer', fontFamily: "'Inter', sans-serif",
              }}
            >
              {r.label}
            </button>
          ))}
        </div>

        <div style={{ background: '#0D0D0D', border: '1px solid #2A2A2A', borderRadius: 16, padding: '16px 8px 8px' }}>
          <PortfolioChart
            data={data}
            hideValues={false}
            lang={lang}
            currency={currency}
            storageKeyPrefix="tp_price"
            height={isMobile ? 300 : 440}
            showPriceRow={false}
            clampMinZero={false}
            dateFormatter={isLive ? fmtTime : fmtDate}
            smooth={isLive}
            chartType="line"
          />
        </div>
        <div style={{ color: '#555555', fontSize: 11, marginTop: 10 }}>
          {t('drawingsSaved', lang)}
        </div>
      </div>
    </div>
  );
}

function ThorchainPortfolio() {
  // Eigene Wallet-Adresse wird automatisch lokal im Browser gespeichert (localStorage),
  // sobald sie erfolgreich geladen wurde — kein manuelles "Merken" mehr nötig.
  const [address, setAddress] = useState(() => {
    try { return localStorage.getItem('tp_address') || ''; } catch (e) { return ''; }
  });
  // Liste aller getrackten Wallet-Adressen (für die kombinierte Summenansicht). Migriert
  // automatisch die alte Einzel-Adresse, falls jemand die App schon vorher genutzt hat.
  const [wallets, setWallets] = useState(() => {
    try {
      const raw = localStorage.getItem('tp_wallets');
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length) return arr;
      }
      const legacy = localStorage.getItem('tp_address');
      return legacy && legacy.trim() ? [legacy.trim()] : [];
    } catch (e) { return []; }
  });
  useEffect(() => {
    try { localStorage.setItem('tp_wallets', JSON.stringify(wallets)); } catch (e) {}
  }, [wallets]);
  const addWallet = (addr) => {
    const clean = (addr || '').trim();
    if (!clean || !clean.startsWith('thor1')) return false;
    setWallets((prev) => (prev.includes(clean) ? prev : [...prev, clean]));
    return true;
  };
  const removeWallet = (addr) => {
    setWallets((prev) => prev.filter((w) => w !== addr));
  };
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [balance, setBalance] = useState(null);
  const [bonded, setBonded] = useState(null);
  // Hält die zuletzt bekannten Werte per Ref fest (nicht nur per State), damit
  // fetchPortfolio auch bei mehrfachem Aufruf (Refresh-Button) immer den *aktuellen* Wert
  // sieht und nicht einen veralteten aus dem Zeitpunkt, als die Funktion erstellt wurde.
  // Hält den zuletzt bekannten Bonded-/Balance-Wert PRO Adresse fest (nicht nur global), damit
  // der Lag-Erkennungs-Schutz (siehe fetchPortfolio) für jede Wallet unabhängig funktioniert,
  // auch wenn mehrere Wallets gleichzeitig getrackt werden.
  const bondedByAddrRef = useRef({});
  const balanceByAddrRef = useRef({});
  const [price, setPrice] = useState(null);
  const [altPrice, setAltPrice] = useState(null); // Preis des in priceRowBox gewählten Vergleichs-Coins
  // Welcher Coin neben RUNE angezeigt wird (Standard: BTC) — lokal gemerkt.
  const [altCoinCode, setAltCoinCode] = useState(() => {
    try { return localStorage.getItem('tp_alt_coin') || 'BTC'; } catch (e) { return 'BTC'; }
  });
  const altCoin = ALT_COIN_OPTIONS.find((c) => c.code === altCoinCode) || ALT_COIN_OPTIONS[0];
  const [altCoinPickerOpen, setAltCoinPickerOpen] = useState(false);
  useEffect(() => {
    try { localStorage.setItem('tp_alt_coin', altCoinCode); } catch (e) {}
  }, [altCoinCode]);
  const [history, setHistory] = useState([]);
  const [range, setRange] = useState(7);
  const [hasData, setHasData] = useState(false);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [hideValue, setHideValue] = useState(false);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('tp_lang') || 'de'; } catch (e) { return 'de'; }
  });
  const [langPickerOpen, setLangPickerOpen] = useState(false);
  const [currency, setCurrency] = useState(() => {
    try { return localStorage.getItem('tp_currency') || 'usd'; } catch (e) { return 'usd'; }
  });
  const [currencyPickerOpen, setCurrencyPickerOpen] = useState(false);
  const [volume24h, setVolume24h] = useState(null); // RUNE-Menge, netzwerkweit
  const [volumeHistory, setVolumeHistory] = useState(null); // [{ t, volumeRune }] letzte 30 Tage
  const [runeChart4h, setRuneChart4h] = useState([]); // [{ date, value }] Minutenkerzen der letzten 4h
  const [showRuneChartModal, setShowRuneChartModal] = useState(false);
  // Zwei "Seiten" auf dem Handy (Chart / Details), damit man nicht mehr scrollen muss --
  // per Tab-Button oder Wischgeste wechselbar. Auf dem Desktop bleibt alles nebeneinander
  // sichtbar (siehe .tp-panel Regeln im <style>-Block).
  const [mobileTab, setMobileTab] = useState('chart'); // 'chart' | 'details'
  const swipeStartRef = useRef(null);
  const handleContentTouchStart = (e) => {
    swipeStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  };
  const handleContentTouchEnd = (e) => {
    const start = swipeStartRef.current;
    swipeStartRef.current = null;
    if (!start) return;
    const dx = e.changedTouches[0].clientX - start.x;
    const dy = e.changedTouches[0].clientY - start.y;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // zu kurz oder eher vertikal -> ignorieren
    if (dx < 0) setMobileTab('details'); // nach links wischen -> Details
    else setMobileTab('chart'); // nach rechts wischen -> Chart
  };

  // Nine Realms (das Team hinter thornode/midgard.ninerealms.com) hat den Betrieb komplett
  // eingestellt ("We've made the difficult decision to shut down the company") — die
  // ninerealms.com-Endpunkte existieren daher nicht mehr und werden nicht mehr angefragt.
  // Liquify ist der von der THORChain-Doku offiziell empfohlene Gateway und einzige Quelle.
  // Holt Kerzendaten (Klines) für RUNE/USDT von Binance und liefert sie als
  // [{ date, value, open, high, low }] zurück — verwendet vom kleinen 4h-Chart und vom
  // großen, zeichenbaren Chart-Modal (value = Schlusskurs, für Linien-Charts; open/high/low
  // zusätzlich für die Kerzendarstellung). Rechnet bei Bedarf grob in EUR um (über das
  // aktuelle USD/EUR-Verhältnis), da Binance nur USDT-Paare liefert.
  const fetchRuneKlines = useCallback(async (interval, limit) => {
    try {
      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=RUNEUSDT&interval=${interval}&limit=${limit}`);
      if (!res.ok) return null;
      const raw = await res.json();
      const usdSeries = raw.map((k) => ({
        date: k[0],
        value: parseFloat(k[4]),
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low: parseFloat(k[3]),
      }));
      if (currency !== 'usd' && price && price.usd && price.local) {
        const ratio = price.local / price.usd;
        return usdSeries.map((d) => ({
          date: d.date,
          value: d.value * ratio,
          open: d.open * ratio,
          high: d.high * ratio,
          low: d.low * ratio,
        }));
      }
      return usdSeries;
    } catch (e) {
      return null;
    }
  }, [currency, price]);

  // Lädt den kleinen 1D-Chart neben "Total RUNE"/"Bonded" und hält ihn per Intervall aktuell.
  useEffect(() => {
    let cancelled = false;
    const load = () => {
      fetchRuneKlines('5m', 288).then((d) => { if (!cancelled && d && d.length > 1) setRuneChart4h(d); });
    };
    load();
    const id = setInterval(load, 60000);
    return () => { cancelled = true; clearInterval(id); };
  }, [fetchRuneKlines]);

  const BALANCE_ENDPOINTS = [
    (addr) => `https://gateway.liquify.com/chain/thorchain_api/cosmos/bank/v1beta1/balances/${addr}`,
  ];

  // Node-Liste (enthält bond_providers) für bonded RUNE.
  const NODES_ENDPOINTS = [
    () => `https://gateway.liquify.com/chain/thorchain_api/thorchain/nodes`,
  ];

  // Vollständige tägliche RUNE-Preishistorie (seit Listing) — ein einziger Abruf pro Basis, um
  // jedem historischen Reward-Eintrag den damaligen Preis zuordnen zu können, statt für jeden
  // der ~160 Einträge einzeln nachzufragen. USD wird EINMAL geholt und für jede Währung
  // wiederverwendet; die "lokale" Serie (in der gewählten Währung) wird pro Währungscode
  // separat gecacht, damit ein Wechsel zwischen Währungen nicht ständig neu abfragt.
  const [priceHistoryFull, setPriceHistoryFull] = useState(null); // { usd: [[tsMs, price], ...], local: [...] }
  const usdHistoryRef = useRef(null);
  const usdHistoryPromiseRef = useRef(null);
  const localHistoryCacheRef = useRef({}); // currencyCode -> [[tsMs, price], ...]
  const localHistoryPromiseCacheRef = useRef({});

  const fetchUsdHistoryOnce = useCallback(async () => {
    if (usdHistoryRef.current) return usdHistoryRef.current;
    if (usdHistoryPromiseRef.current) return usdHistoryPromiseRef.current;
    const promise = (async () => {
      // Primär: Binance — großzügiges Rate-Limit, wird ohnehin für den Live-Preis genutzt.
      try {
        const runeRes = await fetch('https://api.binance.com/api/v3/klines?symbol=RUNEUSDT&interval=1d&limit=1000');
        if (!runeRes.ok) throw new Error('BINANCE_HIST_FAIL');
        const runeKlines = await runeRes.json();
        if (!Array.isArray(runeKlines) || runeKlines.length === 0) throw new Error('BINANCE_HIST_EMPTY');
        const usd = runeKlines.map((k) => [k[0], parseFloat(k[4])]);
        usdHistoryRef.current = usd;
        return usd;
      } catch (binanceErr) {
        console.warn('[RUNE Portfolio] Binance-USD-Historie fehlgeschlagen, weiche auf CoinGecko aus:', binanceErr);
      }
      // Fallback: CoinGecko, mit Retry falls kurzzeitig rate-limitiert.
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const res = await fetch('https://api.coingecko.com/api/v3/coins/thorchain/market_chart?vs_currency=usd&days=max&interval=daily');
          if (!res.ok) throw new Error('CHART_FAIL_' + res.status);
          const json = await res.json();
          const usd = json.prices || [];
          usdHistoryRef.current = usd;
          return usd;
        } catch (e) {
          if (attempt === 0) { await new Promise((r) => setTimeout(r, 1500)); continue; }
          console.warn('[RUNE Portfolio] USD-Preishistorie konnte nicht geladen werden:', e);
          return null;
        }
      }
      return null;
    })();
    usdHistoryPromiseRef.current = promise;
    try {
      return await promise;
    } finally {
      usdHistoryPromiseRef.current = null;
    }
  }, []);

  const fetchPriceHistoryFullOnce = useCallback(async (targetCurrency) => {
    const cur = (targetCurrency || 'usd').toLowerCase();
    const usd = await fetchUsdHistoryOnce();
    if (!usd) return null;

    if (cur === 'usd') {
      const result = { usd, local: usd };
      setPriceHistoryFull(result);
      return result;
    }
    if (localHistoryCacheRef.current[cur]) {
      const result = { usd, local: localHistoryCacheRef.current[cur] };
      setPriceHistoryFull(result);
      return result;
    }
    if (localHistoryPromiseCacheRef.current[cur]) {
      const local = await localHistoryPromiseCacheRef.current[cur];
      const result = { usd, local: local || usd };
      setPriceHistoryFull(result);
      return result;
    }

    const promise = (async () => {
      // EUR: exakte tägliche Umrechnung über Binance EUR/USDT-Kerzen (schnell, zuverlässig).
      if (cur === 'eur') {
        try {
          const eurRes = await fetch('https://api.binance.com/api/v3/klines?symbol=EURUSDT&interval=1d&limit=1000');
          if (eurRes.ok) {
            const eurKlines = await eurRes.json();
            const eurByDay = new Map(eurKlines.map((k) => [k[0], parseFloat(k[4])]));
            const local = usd.map(([ts, usdVal]) => {
              const eurUsdt = eurByDay.get(ts);
              return [ts, eurUsdt ? usdVal / eurUsdt : usdVal];
            });
            localHistoryCacheRef.current[cur] = local;
            return local;
          }
        } catch (e) { /* fällt auf CoinGecko zurück */ }
      }
      // Alle anderen Währungen (und EUR-Fallback): direkt von CoinGecko in der Zielwährung.
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const res = await fetch(`https://api.coingecko.com/api/v3/coins/thorchain/market_chart?vs_currency=${cur}&days=max&interval=daily`);
          if (!res.ok) throw new Error('CHART_FAIL_' + res.status);
          const json = await res.json();
          const local = json.prices || [];
          localHistoryCacheRef.current[cur] = local;
          return local;
        } catch (e) {
          if (attempt === 0) { await new Promise((r) => setTimeout(r, 1500)); continue; }
          console.warn(`[RUNE Portfolio] Preishistorie für ${cur} konnte nicht geladen werden:`, e);
          return null;
        }
      }
      return null;
    })();
    localHistoryPromiseCacheRef.current[cur] = promise;
    let local;
    try {
      local = await promise;
    } finally {
      delete localHistoryPromiseCacheRef.current[cur];
    }
    const result = { usd, local: local || usd };
    setPriceHistoryFull(result);
    return result;
  }, [fetchUsdHistoryOnce]);

  useEffect(() => { fetchPriceHistoryFullOnce(currency); }, [fetchPriceHistoryFullOnce, currency]);

  // Findet den nächstgelegenen (letzten bekannten) Preis vor oder an einem gegebenen Zeitpunkt.
  const findPriceAt = (series, tsMs) => {
    if (!series || series.length === 0) return null;
    let lo = 0, hi = series.length - 1, best = null;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (series[mid][0] <= tsMs) { best = series[mid][1]; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    return best != null ? best : series[0][1];
  };

  // Live-Preis-Updates via wiederholtes Abfragen der Binance-REST-API (kein WebSocket mehr,
  // da wss:// in manchen Vorschau-/Sandbox-Umgebungen blockiert wird, fetch() aber zuverlässig
  // funktioniert). Aktualisiert Preis/Vergleichs-Coin-Preis jede Sekunde, ohne die Seite neu zu
  // laden. Für Währungen jenseits USD/EUR (kein direktes Binance-Paar) wird der USD-Preis
  // weiterhin sekündlich aktualisiert, aber mit einem separat, seltener (alle 60s über
  // CoinGecko) aufgefrischten Umrechnungskurs in die Zielwährung multipliziert — so bleibt die
  // Anzeige "live", ohne CoinGecko im Sekundentakt anzufragen (Rate-Limit).
  const [liveConnected, setLiveConnected] = useState(false);
  const localFxRateRef = useRef(1); // Einheiten der Zielwährung pro 1 USD (1 wenn currency === 'usd')

  useEffect(() => {
    if (currency === 'usd') { localFxRateRef.current = 1; return; }
    if (currency === 'eur') return; // läuft über EURUSDT im Tick selbst
    let cancelled = false;
    const refreshFx = async () => {
      try {
        // "tether" ist ein USD-Stablecoin — sein Kurs in der Zielwährung entspricht (nahezu)
        // dem USD/Zielwährung-Wechselkurs, ohne eine dedizierte FX-API zu brauchen.
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=${currency}`);
        if (!res.ok) return;
        const json = await res.json();
        const rate = json && json.tether && json.tether[currency];
        if (rate && !cancelled) localFxRateRef.current = rate;
      } catch (e) { /* Kurs bleibt auf dem letzten bekannten Stand */ }
    };
    refreshFx();
    const id = setInterval(refreshFx, 60000);
    return () => { cancelled = true; clearInterval(id); };
  }, [currency]);

  useEffect(() => {
    if (!hasData) return;
    let cancelled = false;
    let pollTimer = null;

    const tick = async () => {
      try {
        const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=%5B%22RUNEUSDT%22%2C%22${altCoin.binanceSymbol}%22%2C%22EURUSDT%22%5D`);
        if (!res.ok) throw new Error('POLL_FAIL_' + res.status);
        const json = await res.json();
        const getP = (sym) => {
          const entry = Array.isArray(json) ? json.find((x) => x.symbol === sym) : null;
          return entry ? parseFloat(entry.price) : null;
        };
        const rune = getP('RUNEUSDT');
        const alt = getP(altCoin.binanceSymbol);
        const eurUsdt = getP('EURUSDT');
        if (rune == null || alt == null || eurUsdt == null) throw new Error('POLL_MISSING_DATA');
        if (cancelled) return;
        const toLocal = (usdVal) => {
          if (currency === 'usd') return usdVal;
          if (currency === 'eur') return usdVal / eurUsdt;
          return usdVal * localFxRateRef.current;
        };
        setPrice({ usd: rune, local: toLocal(rune) });
        setAltPrice({ usd: alt, local: toLocal(alt) });
        setLastUpdated(new Date());
        setLiveConnected(true);
      } catch (e) {
        console.warn('[RUNE Portfolio] Live-Preis-Polling fehlgeschlagen:', e);
        if (!cancelled) setLiveConnected(false);
      }
    };

    tick(); // sofort einmal ausführen, dann im Intervall
    pollTimer = setInterval(tick, 1000);

    return () => {
      cancelled = true;
      if (pollTimer) clearInterval(pollTimer);
    };
  }, [hasData, altCoin.binanceSymbol, currency]);

  // 24h-Volumen (+ dessen 30-Tage-Historie fürs Sparkline) alle 30s automatisch neu abfragen,
  // damit es nicht nur beim initialen Laden bzw. manuellen Refresh aktuell ist.
  useEffect(() => {
    if (!hasData) return;
    let cancelled = false;
    const tick = async () => {
      try {
        const [vol, hist] = await Promise.all([fetchVolume24h(), fetchVolumeHistory()]);
        if (cancelled) return;
        if (vol != null) setVolume24h(vol);
        if (hist != null) setVolumeHistory(hist);
      } catch (e) {
        console.warn('[RUNE Portfolio] Auto-Refresh Volumen fehlgeschlagen:', e);
      }
    };
    const volTimer = setInterval(tick, 30000);
    return () => {
      cancelled = true;
      clearInterval(volTimer);
    };
  }, [hasData]);

  const fetchBalanceWithFallback = async (addr) => {
    let lastErr = null;
    for (const buildUrl of BALANCE_ENDPOINTS) {
      const url = buildUrl(addr);
      try {
        const res = await fetch(url, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        if (res.status === 404) {
          throw new Error('NOT_FOUND');
        }
        if (!res.ok) {
          throw new Error('HTTP_' + res.status);
        }
        const json = await res.json();
        return json;
      } catch (e) {
        lastErr = e;
        // bei "Adresse nicht gefunden" macht ein Fallback keinen Sinn -> direkt weiterwerfen
        if (e && e.message === 'NOT_FOUND') throw e;
        // sonst: nächsten Endpunkt probieren
      }
    }
    throw lastErr || new Error('NETWORK');
  };

  // Summiert bonded RUNE über alle Nodes, bei denen die Adresse als Bond Provider
  // (oder Node Operator) gelistet ist. Liefert zusätzlich den gesamten aktiven Netzwerk-Bond
  // mit (wird für die Churn-Reward-Schätzung gebraucht). Gibt { bonded: null, ... } zurück,
  // wenn die Abfrage fehlschlägt (dann wird bonded RUNE einfach als 0 behandelt).
  const fetchBondedRune = async (addr) => {
    for (const buildUrl of NODES_ENDPOINTS) {
      const url = buildUrl();
      try {
        const res = await fetch(url, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        if (!res.ok) continue;
        const nodes = await res.json();
        let totalBondBase = 0;
        let totalActiveBondBase = 0;
        const matchedNodeAddresses = [];
        // Live "aktuell aufgelaufener Reward" für diese Adresse: THORNode führt pro Node einen
        // laufenden current_award-Zähler (Belohnung seit dem letzten Churn), abzüglich der
        // Node-Operator-Gebühr, anteilig nach Bond-Anteil. Wird beim nächsten Churn ausgezahlt.
        let accruedAwardBase = 0;
        for (const node of nodes || []) {
          const providers = (node.bond_providers && node.bond_providers.providers) || [];
          let nodeTotalBondBase = 0;
          let myBondInNodeBase = 0;
          for (const p of providers) {
            const pBond = parseInt(p.bond, 10) || 0;
            nodeTotalBondBase += pBond;
            if (p.bond_address === addr) {
              totalBondBase += pBond;
              myBondInNodeBase = pBond;
            }
          }
          if (myBondInNodeBase > 0 && nodeTotalBondBase > 0) {
            const feeBps = parseInt((node.bond_providers && node.bond_providers.node_operator_fee) || '0', 10) || 0;
            const fee = feeBps / 10000;
            const currentAwardBase = parseInt(node.current_award, 10) || 0;
            const myShare = myBondInNodeBase / nodeTotalBondBase;
            accruedAwardBase += myShare * currentAwardBase * (1 - fee);
            if (node.node_address) matchedNodeAddresses.push(node.node_address);
          }
          if (node.status === 'Active') {
            totalActiveBondBase += parseInt(node.total_bond, 10) || 0;
          }
        }
        return { bonded: totalBondBase / 1e8, totalActiveBondBase, accruedAward: accruedAwardBase / 1e8, matchedNodeAddresses };
      } catch (e) {
        // nächsten Endpunkt probieren
      }
    }
    return { bonded: null, totalActiveBondBase: null, accruedAward: null, matchedNodeAddresses: [] };
  };

  // Countdown bis zum nächsten Churn (= wann der aufgelaufene Reward tatsächlich ausgezahlt
  // wird). nextChurnHeight kommt von Midgard, die aktuelle Blockhöhe von THORNode; die Differenz
  // in Blöcken × ~6 Sekunden/Block ergibt die verbleibende Zeit (THORChain-Standard-Blockzeit).
  // Zusätzlich wird das HALTCHURNING-Mimir-Flag geprüft: ist Churning pausiert, ist eine reine
  // Blockhöhen-Rechnung irreführend (Verzögerungen kommen häufig vor) — dann zeigen wir
  // stattdessen klar "pausiert" an, statt eine falsche/zu genaue Restzeit vorzugaukeln.
  const [churnCountdown, setChurnCountdown] = useState(null); // { nextChurnEstimateMs, halted }
  const fetchChurnCountdown = useCallback(async () => {
    try {
      const [networkRes, blockRes, mimirRes] = await Promise.all([
        fetch('https://gateway.liquify.com/chain/thorchain_midgard/v2/network', { headers: { 'x-client-id': 'rune-portfolio-app' } }),
        fetch('https://gateway.liquify.com/chain/thorchain_api/thorchain/lastblock', { headers: { 'x-client-id': 'rune-portfolio-app' } }),
        fetch('https://gateway.liquify.com/chain/thorchain_api/thorchain/mimir', { headers: { 'x-client-id': 'rune-portfolio-app' } }),
      ]);
      if (!networkRes.ok || !blockRes.ok) return;
      const network = await networkRes.json();
      const blocks = await blockRes.json();
      let halted = false;
      if (mimirRes.ok) {
        try {
          const mimir = await mimirRes.json();
          // Key-Suche case-insensitiv, THORNode liefert i.d.R. Großbuchstaben-Keys.
          const haltKey = Object.keys(mimir || {}).find((k) => k.toUpperCase() === 'HALTCHURNING');
          halted = haltKey != null && Number(mimir[haltKey]) === 1;
        } catch (e) { /* Mimir optional, bei Fehler einfach nicht als pausiert werten */ }
      }
      const nextChurnHeight = parseInt(network.nextChurnHeight, 10);
      const currentHeight = parseInt((blocks && blocks[0] && blocks[0].thorchain) || '0', 10);
      if (!nextChurnHeight || !currentHeight) { setChurnCountdown({ nextChurnEstimateMs: null, halted }); return; }
      const blocksRemaining = Math.max(0, nextChurnHeight - currentHeight);
      const secondsRemaining = blocksRemaining * 6;
      setChurnCountdown({ nextChurnEstimateMs: Date.now() + secondsRemaining * 1000, halted });
    } catch (e) {
      // Countdown ist ein Extra — bei Fehler einfach nichts anzeigen, Rest der App bleibt unberührt.
    }
  }, []);
  useEffect(() => {
    fetchChurnCountdown();
    const id = setInterval(fetchChurnCountdown, 5 * 60 * 1000); // alle 5 Minuten reicht, ändert sich selten
    return () => clearInterval(id);
  }, [fetchChurnCountdown]);

  // Bond-Rewards, exakt: THORChain-Bond-Rewards werden zwar automatisch in den Bond
  // eingerechnet (keine einzelnen "Reward-Events"), aber wir können sie trotzdem rückwirkend
  // berechnen: Gesamt-Rewards = aktueller Bond − (Summe aller BOND-Einzahlungen − Summe aller
  // UNBOND-Auszahlungen). Diese Ein-/Auszahlungen sind echte, historisch abrufbare Transaktionen
  // über die Midgard-API. Schlägt das fehl (z.B. Netzwerkproblem), fällt die App automatisch auf
  // ein lokales "seit App-Nutzung"-Tracking zurück.
  // Nine Realms hat den Betrieb komplett eingestellt — midgard.ninerealms.com existiert daher
  // nicht mehr. Liquify ist der von der THORChain-Doku empfohlene Haupt-Gateway;
  // midgard.thorchain.network ist die offiziell dokumentierte öffentliche Alternative.
  const MIDGARD_BASES = [
    'https://gateway.liquify.com/chain/thorchain_midgard/v2',
    'https://midgard.thorchain.network/v2',
  ];

  // 24h-Handelsvolumen des gesamten THORChain-Netzwerks — dieselbe Datenquelle (Midgard),
  // die auch thorchain.net für diese Kennzahl verwendet. Wir summieren 24 Stunden-Intervalle
  // statt ein einzelnes Tages-Intervall zu nehmen — dadurch entsteht kein Problem, falls der
  // aktuelle UTC-Tag gerade erst begonnen hat (was sonst fälschlich nahe 0 anzeigen würde).
  const fetchVolume24h = async () => {
    for (const base of MIDGARD_BASES) {
      try {
        const res = await fetch(`${base}/history/swaps?interval=hour&count=24`, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        if (!res.ok) {
          console.warn('[RUNE Portfolio] Volumen-Anfrage HTTP-Fehler', res.status, base);
          continue;
        }
        const json = await res.json();
        const intervals = json.intervals || [];
        if (!intervals.length) {
          console.warn('[RUNE Portfolio] Volumen: keine Intervalle in Antwort von', base, json);
          continue;
        }
        console.info('[RUNE Portfolio] Volumen-Rohdaten (erstes Intervall):', intervals[0]);
        let totalBase = 0;
        let foundField = false;
        for (const iv of intervals) {
          const raw = iv.totalVolume ?? iv.volume ?? null;
          if (raw == null) continue;
          const n = parseInt(raw, 10);
          if (isFinite(n)) { totalBase += n; foundField = true; }
        }
        if (!foundField) {
          console.warn('[RUNE Portfolio] Volumen: kein bekanntes Volumen-Feld gefunden, Beispiel-Intervall:', intervals[0]);
          continue;
        }
        return totalBase / 1e8; // RUNE
      } catch (e) {
        console.warn('[RUNE Portfolio] Netzwerkfehler bei Volumen-Anfrage:', base, e);
      }
    }
    return null;
  };

  // Tages-Volumen der letzten 30 Tage (für den kleinen Sparkline-Graphen unter dem
  // 24h-Volumen-Wert). Gleiche Datenquelle wie fetchVolume24h, nur mit Tages-Intervallen.
  const fetchVolumeHistory = async () => {
    for (const base of MIDGARD_BASES) {
      try {
        const res = await fetch(`${base}/history/swaps?interval=day&count=30`, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        if (!res.ok) continue;
        const json = await res.json();
        const intervals = json.intervals || [];
        if (!intervals.length) continue;
        const points = intervals.map((iv) => {
          const raw = iv.totalVolume ?? iv.volume ?? null;
          const n = raw != null ? parseInt(raw, 10) : NaN;
          return {
            t: parseInt(iv.startTime, 10) * 1000,
            volumeRune: isFinite(n) ? n / 1e8 : 0,
          };
        });
        return points;
      } catch (e) {
        console.warn('[RUNE Portfolio] Netzwerkfehler bei Volumen-Historie-Anfrage:', base, e);
      }
    }
    return null;
  };

  // Ruft Midgard-Actions ab und summiert Bond-/Unbond-Beträge. Probiert mehrere Basis-URLs
  // (Liquify zuerst) und Filter-Varianten durch und filtert zusätzlich clientseitig nach dem
  // tatsächlichen "type"-Feld jeder zurückgegebenen Aktion — das ist die zuverlässigste Methode.
  const fetchActionsForType = async (addr, txType) => {
    const attempts = [];
    for (const base of MIDGARD_BASES) {
      attempts.push(`${base}/actions?address=${addr}&txType=${txType}&limit=50`);
      attempts.push(`${base}/actions?address=${addr}&type=${txType}&limit=50`);
    }
    for (const baseUrl of attempts) {
      let offset = 0;
      let pages = 0;
      let totalBase = 0;
      let earliestDateMs = null;
      let matchedAny = false;
      let hadError = false;
      const items = [];
      while (pages < 12) {
        const url = `${baseUrl}&offset=${offset}`;
        let res;
        try {
          res = await fetch(url, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        } catch (netErr) {
          console.warn('[RUNE Portfolio] Netzwerkfehler bei Midgard-Anfrage (evtl. CORS):', url, netErr);
          hadError = true;
          break;
        }
        if (!res.ok) {
          const bodyText = await res.text().catch(() => '');
          console.warn('[RUNE Portfolio] Midgard antwortete mit Fehler', res.status, url, bodyText.slice(0, 300));
          hadError = true;
          break;
        }
        const json = await res.json();
        const actions = json.actions || [];
        if (actions.length === 0) break;
        for (const a of actions) {
          if (a.type !== txType) continue; // clientseitiger Filter, unabhängig vom URL-Parameter
          matchedAny = true;
          let amountBase = 0;
          const coinsGroups = txType === 'bond' ? (a.in || []) : (a.out && a.out.length ? a.out : (a.in || []));
          for (const grp of coinsGroups) {
            for (const c of (grp.coins || [])) {
              if (c.asset === 'THOR.RUNE' || c.asset === 'RUNE') {
                amountBase += parseInt(c.amount, 10) || 0;
              }
            }
          }
          totalBase += amountBase;
          const dateMs = a.date ? Math.floor(parseInt(a.date, 10) / 1e6) : null;
          if (dateMs && (earliestDateMs === null || dateMs < earliestDateMs)) earliestDateMs = dateMs;
          // Die Node-Adresse steckt direkt in den Metadaten jeder Bond/Unbond-Transaktion
          // (metadata.bond.nodeAddress, gilt für beide Richtungen) — das ist entscheidend, um
          // auch Nodes zu finden, von denen die Adresse inzwischen komplett abgebonded hat und
          // die deshalb in der AKTUELLEN Node-Liste nicht mehr auftauchen.
          const nodeAddress = (a.metadata && a.metadata.bond && a.metadata.bond.nodeAddress) || null;
          items.push({ dateMs, amount: amountBase / 1e8, type: txType, txId: (a.in && a.in[0] && a.in[0].txID) || null, height: parseInt(a.height, 10) || null, nodeAddress });
        }
        if (actions.length < 50) break;
        offset += 50;
        pages++;
      }
      if (hadError) continue; // nächste URL-Variante probieren
      if (matchedAny) {
        console.info(`[RUNE Portfolio] Midgard-Treffer für Typ "${txType}" über`, baseUrl.split('?')[1].split('&')[1]);
        return { totalBase, earliestDateMs, found: true, items };
      }
      // 0 Treffer, aber kein technischer Fehler -> könnte einfach bedeuten "nie unbonded" o.ä.
    }
    return { totalBase: 0, earliestDateMs: null, found: false, items: [] };
  };

  const fetchBondLedger = async (addr) => {
    try {
      const bondRes = await fetchActionsForType(addr, 'bond');
      if (!bondRes.found) {
        console.warn('[RUNE Portfolio] Keine BOND-Aktionen über Midgard gefunden für', addr);
        throw new Error('NO_BOND_ACTIONS');
      }
      const unbondRes = await fetchActionsForType(addr, 'unbond');
      const allItems = [...bondRes.items, ...unbondRes.items].sort((a, b) => (b.dateMs || 0) - (a.dateMs || 0));
      return {
        success: true,
        principal: (bondRes.totalBase - unbondRes.totalBase) / 1e8,
        earliestDateMs: bondRes.earliestDateMs,
        transactions: allItems,
      };
    } catch (e) {
      console.warn('[RUNE Portfolio] Bond-Ledger via Midgard fehlgeschlagen, falle zurück auf lokales Tracking:', e);
      return { success: false };
    }
  };

  // Liste aller Churns (Höhe + Zeitpunkt) von Midgard — global, unabhängig von der Adresse.
  // Wird einmal geholt und für die automatische Reward-Rekonstruktion aller beobachteten
  // Adressen wiederverwendet.
  const fetchChurnsList = async () => {
    for (const base of MIDGARD_BASES) {
      try {
        const res = await fetch(`${base}/churns`, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        if (!res.ok) continue;
        const raw = await res.json();
        if (!Array.isArray(raw) || raw.length === 0) continue;
        return raw
          .map((c) => ({ height: parseInt(c.height, 10), dateMs: Math.floor(parseInt(c.date, 10) / 1e6) }))
          .filter((c) => c.height && c.dateMs)
          .sort((a, b) => a.height - b.height); // aufsteigend, älteste zuerst
      } catch (e) {
        // nächste Basis probieren
      }
    }
    return [];
  };

  // THORNode erlaubt historische Abfragen per ?height=<Blocknummer> — damit lässt sich
  // current_award (und der Bond-Anteil) exakt zum Zeitpunkt eines vergangenen Churns
  // auslesen, statt ihn aus der Historie zu schätzen. Verwendet den EINZEL-Node-Endpunkt
  // (/thorchain/node/<adresse>?height=N), da nur für diesen offiziell belegt ist, dass
  // historische Höhenabfragen unterstützt werden (siehe THORChain-Doku-Beispiele) — der
  // Sammel-Endpunkt /thorchain/nodes unterstützt height evtl. nicht zuverlässig. Fällt bei
  // Fehlschlag auf einen dedizierten Archiv-Knoten zurück (manche Gateways liefern für sehr
  // alte Blockhöhen sonst 404, ein reiner Archiv-Node hat oft mehr Historie vorrätig).
  const HISTORICAL_NODE_BASES = [
    'https://gateway.liquify.com/chain/thorchain_api',
    'https://thornode-archive.ninerealms.com',
  ];
  const fetchHistoricalNodeAt = async (nodeAddress, height) => {
    let lastError = null;
    for (const base of HISTORICAL_NODE_BASES) {
      try {
        const url = `${base}/thorchain/node/${nodeAddress}?height=${height}`;
        const res = await fetch(url, { headers: { 'x-client-id': 'rune-portfolio-app' } });
        if (!res.ok) { lastError = new Error('HTTP_' + res.status); continue; }
        return await res.json();
      } catch (e) {
        lastError = e; // nächste Basis probieren (z.B. bei CORS-Fehler)
      }
    }
    throw lastError || new Error('ALL_BASES_FAILED');
  };

  // Berechnet aus einem (historischen oder aktuellen) einzelnen Node-Objekt den Reward-Anteil
  // einer Bond-Adresse — dieselbe Formel wie in fetchBondedRune, nur für einen einzelnen Node.
  const computeAddressAwardFromNode = (node, addr) => {
    if (!node) return 0;
    const providers = (node.bond_providers && node.bond_providers.providers) || [];
    let nodeTotalBondBase = 0;
    let myBondInNodeBase = 0;
    for (const p of providers) {
      const pBond = parseInt(p.bond, 10) || 0;
      nodeTotalBondBase += pBond;
      if (p.bond_address === addr) myBondInNodeBase = pBond;
    }
    if (myBondInNodeBase <= 0 || nodeTotalBondBase <= 0) return 0;
    const feeBps = parseInt((node.bond_providers && node.bond_providers.node_operator_fee) || '0', 10) || 0;
    const fee = feeBps / 10000;
    const currentAwardBase = parseInt(node.current_award, 10) || 0;
    return ((myBondInNodeBase / nodeTotalBondBase) * currentAwardBase * (1 - fee)) / 1e8;
  };

  const AUTO_HISTORY_SAFETY_CAP = 400; // Obergrenze gegen Ausreißer, damit der Erst-Aufbau nicht ewig läuft

  // Baut die Reward-Historie für EINE Adresse automatisch aus allen Churns seit ihrem
  // frühesten Bond-Datum auf (statt manueller Einträge): fragt THORNode für jeden relevanten
  // Churn-Zeitpunkt historisch ab, wie viel Reward genau da angefallen ist. Ergebnisse werden
  // pro Churn-Höhe dauerhaft im Browser zwischengespeichert — beim nächsten Laden müssen nur
  // neue, noch nicht bekannte Churns nachgefragt werden. Funktioniert für JEDE Adresse, die
  // ein Besucher eingibt — nicht auf bestimmte Adressen beschränkt.
  // Baut die Reward-Historie für EINE Adresse automatisch aus allen Churns seit ihrem
  // frühesten Bond-Datum auf (statt manueller Einträge): fragt THORNode für jeden relevanten
  // Churn-Zeitpunkt historisch ab (pro Node, an der die Adresse aktuell beteiligt ist), wie
  // viel Reward genau da angefallen ist. Ergebnisse werden pro Churn-Höhe dauerhaft im Browser
  // zwischengespeichert — beim nächsten Laden müssen nur neue, noch nicht bekannte Churns
  // nachgefragt werden. Funktioniert für JEDE Adresse, die ein Besucher eingibt.
  //
  // Verarbeitet in gleichzeitigen Batches (nicht einer nach dem anderen) und ruft nach jedem
  // Batch onBatch(...) mit dem bisherigen Zwischenstand auf — sonst würde bei vielen Monaten
  // Historie sehr lange NICHTS in der Liste erscheinen, obwohl im Hintergrund längst gearbeitet
  // wird. Neueste Churns zuerst, damit die relevantesten Einträge zuerst sichtbar werden.
  const AUTO_HISTORY_BATCH_SIZE = 8;
  const buildAutoRewardHistory = async (addr, nodeAddresses, earliestDateMs, churns, onBatch) => {
    if (!nodeAddresses || nodeAddresses.length === 0) return { entries: [], attempted: 0, failed: 0 };
    let cache = {};
    try {
      const raw = localStorage.getItem(`tp_auto_rewards_v3_${addr}`);
      if (raw) cache = JSON.parse(raw) || {};
    } catch (e) { cache = {}; }

    const marginMs = 4 * 24 * 60 * 60 * 1000; // etwas Puffer vor dem ersten bekannten Bond
    const relevantChurns = (earliestDateMs != null
      ? churns.filter((c) => c.dateMs >= earliestDateMs - marginMs)
      : churns
    ).slice(-AUTO_HISTORY_SAFETY_CAP).reverse(); // neueste zuerst

    const results = [];
    let dirty = false;
    let attempted = 0;
    let failed = 0;

    for (let i = 0; i < relevantChurns.length; i += AUTO_HISTORY_BATCH_SIZE) {
      const batch = relevantChurns.slice(i, i + AUTO_HISTORY_BATCH_SIZE);
      await Promise.all(batch.map(async (churn) => {
        const key = String(churn.height);
        if (cache[key] == null) {
          attempted++;
          try {
            // WICHTIG: den Block VOR dem Churn abfragen, nicht den Churn-Block selbst — an der
            // Churn-Höhe wurde der Reward bereits ausgezahlt und current_award auf 0
            // zurückgesetzt. Der Block davor zeigt den tatsächlich angesammelten Betrag kurz
            // vor der Auszahlung.
            const queryHeight = churn.height - 1;
            const nodeResults = await Promise.all(
              nodeAddresses.map((nodeAddr) => fetchHistoricalNodeAt(nodeAddr, queryHeight))
            );
            cache[key] = nodeResults.reduce((s, node) => s + computeAddressAwardFromNode(node, addr), 0);
            dirty = true;
          } catch (e) {
            failed++;
            return; // dieser Churn (z.B. sehr alt, vor einem Hard-Fork) bleibt unversorgt, nächstes Mal erneut versuchen
          }
        }
        if (cache[key] > 1e-9) {
          results.push({ dateMs: churn.dateMs, amount: cache[key], height: churn.height, isAuto: true });
        }
      }));
      if (onBatch) onBatch([...results], i + batch.length, relevantChurns.length);
    }
    if (dirty) {
      try { localStorage.setItem(`tp_auto_rewards_v3_${addr}`, JSON.stringify(cache)); } catch (e) { /* Speicher evtl. voll */ }
    }
    return { entries: results, attempted, failed };
  };

  // Reward-Tracking für die AKTUELL geladene Wallet-Adresse — nicht mehr auf bestimmte
  // Adressen beschränkt. Jeder Besucher sieht seine eigene Bond-Rewards-Historie, sobald er
  // seine eigene Adresse eingibt und diese Bond > 0 hat.
  const [nodeRewardsData, setNodeRewardsData] = useState({}); // addr -> { loading, error, current, principal, transactions, earliestDateMs, accruedAward }
  const [autoRewardHistory, setAutoRewardHistory] = useState({}); // addr -> [{ dateMs, amount, height, isAuto }]
  const [autoHistoryStatus, setAutoHistoryStatus] = useState('idle'); // 'idle' | 'loading' | 'done' | 'error'
  const [autoHistoryProgress, setAutoHistoryProgress] = useState(null); // { done, total }
  const [trackedAddresses, setTrackedAddresses] = useState([]); // alle Adressen mit Bond > 0, für die Rewards nachgeladen werden
  const [rewardsListExpanded, setRewardsListExpanded] = useState(false); // Rewards-Liste per Klick auf-/zuklappen

  // Letzter bekannter accrued-Award-Wert PRO Adresse, für den Plausibilitäts-Check im
  // Refresh-Intervall unten (verhindert, dass ein kurzzeitiger Daten-Aussetzer den Wert
