# Konfiguration fuer "npx wrangler deploy" (Cloudflare Workers Builds, Repo RUNEMaxim/rune.watch).
#
# WARUM ES DIESE DATEI BRAUCHT
# ----------------------------
# Ohne sie weiss der Deploy weder, welcher Worker gemeint ist, noch welche Datei der
# Einstiegspunkt ist -- und vor allem NICHT, dass der Worker eine D1-Datenbank braucht.
# Genau das war die Ursache dafuer, dass nach jedem Upload ueber GitHub die App Fehler zeigte:
# der Worker lief danach ohne env.DB, also ohne Statistik, Spenden, Wallets und Verlauf.
#
# WICHTIG ZU GEHEIMNISSEN
# -----------------------
# Hier stehen KEINE Schluessel. Werte wie LIQUIFY_API_KEY, MEMOLESS_API_KEY, GITLAB_TOKEN und
# STATS_ACCESS_KEY gehoeren als "Secret" ins Dashboard (Worker -> Settings -> Variables and
# Secrets -> Type: Secret). Secrets ueberleben einen Deploy. Normale "Text"-Variablen im
# Dashboard werden von einem Deploy dagegen ueberschrieben, wenn sie hier nicht aufgefuehrt
# sind -- wer so etwas dauerhaft braucht, traegt es unten unter [vars] ein.
#
# Optional, falls spaeter gebraucht (jeweils als Secret oder [vars]):
#   LIQUIFY_API_KEY, LIQUIFY_MIDGARD_BASE, MIDGARD_EXTRA_BASES, MEMOLESS_UPSTREAM,
#   MEMOLESS_API_KEY, MEMOLESS_ASSETS_UPSTREAM_ONLY, STATS_ACCESS_KEY,
#   STATS_EXCLUDED_ADDRESSES, GITLAB_TOKEN, ALLOWED_ORIGIN

name = "rune-rewards-backend"
main = "worker.js"
compatibility_date = "2026-09-01"

# DER WICHTIGE SCHALTER: ohne ihn LOESCHT jeder Deploy alle Variablen und Secrets, die im
# Dashboard gesetzt wurden -- genau so sind MEMOLESS_UPSTREAM, MEMOLESS_API_KEY und die
# uebrigen Schluessel verschwunden, nachdem ueber GitHub deployt wurde. Mit keep_vars bleiben
# sie erhalten, und die Schluessel muessen NICHT in dieses oeffentliche Repo.
keep_vars = true

# Beobachtbarkeit: Logs im Dashboard unter "Observability" -- hilfreich, wenn wieder etwas
# stillschweigend ausfaellt (z.B. Midgard ohne Kurse).
[observability]
enabled = true

# D1-Datenbank. "binding" ist der Name, unter dem der Code sie anspricht: env.DB.
# Der Name und die ID stammen aus Cloudflare -> Storage & Databases -> D1.
[[d1_databases]]
binding = "DB"
database_name = "rune-rewards-db"
database_id = "426773a7-d86a-4720-9ab2-309a357b6d40"
