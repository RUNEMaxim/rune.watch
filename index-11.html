<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000000; min-height: 100vh; }
  body { font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; }
  .tp-input::placeholder { color: #555555; }
  .tp-input:focus { outline: none; border-color: #FFFFFF !important; color: #F5F5F5 !important; }
  .tp-range-btn:hover { color: #F5F5F5 !important; }
  .tp-price-tile-btn:hover { background: rgba(255,255,255,0.05) !important; }
  .tp-price-tile-btn:active { background: rgba(255,255,255,0.08) !important; }
  @keyframes flow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .tp-price-top { display: none; }
  .tp-price-sidebar { display: block; }
  @media (max-width: 720px) {
    .tp-price-top { display: block; }
    .tp-price-sidebar { display: none; }
  }
  .tp-flow {
    background: linear-gradient(90deg, transparent, #FFFFFF, transparent, #FFFFFF, transparent);
    background-size: 200% 100%;
    animation: flow 6s linear infinite;
  }
  .tp-spin { animation: spin 1s linear infinite; }
  .tp-totals-row { flex-wrap: wrap; }
  /* Kompakteres Layout auf schmalen Bildschirmen: weniger Innen-/Außenabstand,
     damit die Seite nicht unnötig in die Länge gezogen wird wie am Desktop. */
  @media (max-width: 640px) {
    .tp-content-row { gap: 12px !important; }
    .tp-main-card { padding: 16px 16px !important; margin-bottom: 12px !important; }
    .tp-main-card-header { margin-bottom: 12px !important; }
    .tp-chart-card { padding: 10px 4px 4px !important; }
    .tp-sidebar-col { gap: 12px !important; }
    .tp-side-card { padding: 14px 16px !important; }
    .tp-range-row { margin-bottom: 8px !important; }
    .tp-footer { margin-top: 20px !important; padding-top: 12px !important; }
    .tp-price-top { margin-top: 8px !important; margin-bottom: 12px !important; }
    .tp-totals-row { padding-top: 12px !important; }
  }
  .tp-mobile-tabs { display: none; }
  @media (max-width: 640px) {
    .tp-mobile-tabs { display: flex; }
    .tp-chart-panel, .tp-details-panel { display: none !important; }
    .tp-chart-panel.tp-panel-active { display: block !important; }
    .tp-details-panel.tp-panel-active { display: flex !important; }
    /* Auf dem Handy sind Chart- und Details-Tab zwei "Seiten" derselben vollen Breite --
       die Desktop-Sidebar-Breite (max 300px) der Details-Kärtchen darf hier nicht mehr
       greifen, sonst wirken sie kleiner als die Portfolio-Karte im Chart-Tab. */
    .tp-chart-panel, .tp-details-panel { max-width: none !important; min-width: 0 !important; width: 100% !important; }
  }
</style>

<script type="text/babel">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

const RANGES = [
  { label: '7T', labelEn: '7D', days: 7 },
  { label: '30T', labelEn: '30D', days: 30 },
  { label: '90T', labelEn: '90D', days: 90 },
  { label: '1J', labelEn: '1Y', days: 365 },
];
// Zeitraum-Optionen für den einfachen RUNE-Preis-Übersichts-Chart (täglich/wöchentlich/
// monatlich). Nutzt bewusst dieselbe rangeLabel()-Funktion wie RANGES oben, damit die
// Beschriftung exakt im gleichen Stil erscheint wie beim Portfolio-Wert-Chart.
const RUNE_PRICE_CHART_RANGES = [1, 7, 30];

const fmtUSD = (n, lang, currency) =>
  n == null ? '—' : n.toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), maximumFractionDigits: 2 });

// Gerundet auf ganze Zahl, ohne Nachkommastellen (z.B. für große Volumen-Zahlen).
const fmtUSDRounded = (n, lang, currency) =>
  n == null ? '—' : Math.round(n).toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), minimumFractionDigits: 0, maximumFractionDigits: 0 });

// Extrem gerundete, kompakte Darstellung großer Beträge, z.B. "22,2 Mio. $" -> hier als "22,2M".
// Nutzt K/M/B-Suffixe mit einer Nachkommastelle statt der vollen Zahl.
const fmtUSDCompact = (n, lang, currency) => {
  if (n == null) return '—';
  const symbol = getCurrencySymbol((currency || 'usd').toLowerCase());
  const abs = Math.abs(n);
  const locale = localeFor(lang);
  let value, suffix;
  if (abs >= 1e9) { value = n / 1e9; suffix = 'B'; }
  else if (abs >= 1e6) { value = n / 1e6; suffix = 'M'; }
  else if (abs >= 1e3) { value = n / 1e3; suffix = 'K'; }
  else { value = n; suffix = ''; }
  const formatted = value.toLocaleString(locale, { minimumFractionDigits: suffix ? 1 : 0, maximumFractionDigits: suffix ? 1 : 0 });
  return `${symbol}${formatted}${suffix}`;
};

// Für den RUNE-Preis selbst (z.B. "$1.234 / RUNE") — 3 statt 2 Nachkommastellen,
// da RUNE oft im niedrigen Dollarbereich liegt und mehr Präzision hier hilfreich ist.
const fmtUSDPrecise = (n, lang, currency) =>
  n == null ? '—' : n.toLocaleString(localeFor(lang), { style: 'currency', currency: (currency || 'usd').toUpperCase(), minimumFractionDigits: 3, maximumFractionDigits: 3 });

// ---------------------------------------------------------------------------
// Mehrsprachigkeit: 10 Sprachen statt nur DE/EN. TR ist ein Übersetzungs-
// Wörterbuch (Schlüssel -> Text je Sprache); t(key, lang) holt den Text für die
// aktuelle Sprache und fällt auf Englisch zurück, falls ein Schlüssel für eine
// Sprache fehlen sollte. localeFor(lang) liefert den passenden BCP-47-Locale-
// Code für Intl-Zahlen-/Datumsformatierung.
const LANGUAGE_OPTIONS = [
  { code: 'de', label: 'Deutsch', locale: 'de-DE' },
  { code: 'en', label: 'English', locale: 'en-US' },
  { code: 'es', label: 'Español', locale: 'es-ES' },
  { code: 'fr', label: 'Français', locale: 'fr-FR' },
  { code: 'it', label: 'Italiano', locale: 'it-IT' },
  { code: 'pt', label: 'Português', locale: 'pt-PT' },
  { code: 'ja', label: '日本語', locale: 'ja-JP' },
  { code: 'zh', label: '中文', locale: 'zh-CN' },
  { code: 'ru', label: 'Русский', locale: 'ru-RU' },
  { code: 'ko', label: '한국어', locale: 'ko-KR' },
];
const localeFor = (lang) => (LANGUAGE_OPTIONS.find((l) => l.code === lang) || LANGUAGE_OPTIONS[1]).locale;

const RANGE_UNIT_LABELS = {
  de: { d: 'T', y: 'J' }, en: { d: 'D', y: 'Y' }, es: { d: 'D', y: 'A' }, fr: { d: 'J', y: 'A' },
  it: { d: 'G', y: 'A' }, pt: { d: 'D', y: 'A' }, ja: { d: '日', y: '年' }, zh: { d: '天', y: '年' },
  ru: { d: 'Д', y: 'Г' }, ko: { d: '일', y: '년' },
};
const rangeLabel = (days, lang) => {
  const u = RANGE_UNIT_LABELS[lang] || RANGE_UNIT_LABELS.en;
  return days >= 365 ? `1${u.y}` : `${days}${u.d}`;
};

const TR = {
  notEnoughData: { en: 'Not enough data for this period.', de: 'Nicht genug Daten für diesen Zeitraum.', es: 'No hay suficientes datos para este período.', fr: 'Pas assez de données pour cette période.', it: 'Dati insufficienti per questo periodo.', pt: 'Dados insuficientes para este período.', ja: 'この期間のデータが不足しています。', zh: '此时间段的数据不足。', ru: 'Недостаточно данных за этот период.', ko: '이 기간에 대한 데이터가 부족합니다.' },

// Restzeit bis zu einem Zeitpunkt als "Xd Yh" / "Xh Ym" formatieren (z.B. Churn-Countdown).
const TIME_UNIT_LABELS = {
  de: { d: 'T', h: 'Std', m: 'Min', now: 'jeden Moment' }, en: { d: 'd', h: 'h', m: 'm', now: 'any moment' },
  es: { d: 'd', h: 'h', m: 'm', now: 'en cualquier momento' }, fr: { d: 'j', h: 'h', m: 'min', now: "d'un moment à l'autre" },
  it: { d: 'g', h: 'h', m: 'min', now: 'da un momento all\'altro' }, pt: { d: 'd', h: 'h', m: 'min', now: 'a qualquer momento' },
  ja: { d: '日', h: '時間', m: '分', now: 'まもなく' }, zh: { d: '天', h: '小时', m: '分钟', now: '随时' },
  ru: { d: 'д', h: 'ч', m: 'мин', now: 'с минуты на минуту' }, ko: { d: '일', h: '시간', m: '분', now: '곧' },
};
const fmtCountdown = (targetMs, lang) => {
  const u = TIME_UNIT_LABELS[lang] || TIME_UNIT_LABELS.en;
  const ms = targetMs - Date.now();
  if (ms <= 0) return u.now;
  const totalMinutes = Math.floor(ms / 60000);
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;
  if (days > 0) return `${days}${u.d} ${hours}${u.h}`;
  if (hours > 0) return `${hours}${u.h} ${minutes}${u.m}`;
  return `${minutes}${u.m}`;
};

// Lotusblüte, Proportionen aus Referenzbild vermessen (Winkel 0/±38/±75°,
// Längenverhältnis 1 : 0.94 : 0.82), plus RUNE-"R" als Stempel.
const IconLotus = (p) => {
  const size = p.size || 17;
  const baseX = 12, baseY = 16.58;
  const sw = 0.6;

  const bez = (p0, c1, c2, p1) => `M${p0[0]},${p0[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p1[0]},${p1[1]}`;
  const rot = (x, y, deg) => {
    const a = (deg * Math.PI) / 180;
    return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
  };

  const petal = (angleDeg, length, width, key) => {
    const P = (lx, ly) => {
      const [rx, ry] = rot(lx, ly, angleDeg);
      return [baseX + rx, baseY + ry];
    };
    const p0 = P(0, 0);
    const tip = P(0, -length);
    const c1L = P(-width * 0.55, -length * 0.30);
    const c2L = P(-width * 0.32, -length * 0.76);
    const c1R = P(width * 0.32, -length * 0.76);
    const c2R = P(width * 0.55, -length * 0.30);
    const vein0 = P(0, -length * 0.10);
    const vein1 = P(0, -length * 0.86);
    return (
      <g key={key}>
        <path d={bez(p0, c1L, c2L, tip)} fill="none" />
        <path d={bez(tip, c2R, c1R, p0)} fill="none" />
        <line x1={vein0[0]} y1={vein0[1]} x2={vein1[0]} y2={vein1[1]} strokeWidth={sw * 0.55} />
      </g>
    );
  };

  const L = 13.99;
  const petals = [
    [0, L * 1.00, L * 1.00 * 0.30],
    [-38, L * 0.94, L * 0.94 * 0.36],
    [38, L * 0.94, L * 0.94 * 0.36],
    [-75, L * 0.82, L * 0.82 * 0.44],
    [75, L * 0.82, L * 0.82 * 0.44],
  ];

  // RUNE-"R" als Stempel (statt Spirale) — Originalpfad viewBox 0 0 109 214.
  const rTargetH = 3.56;
  const rScale = rTargetH / 214;
  const rMidX = (13 + 96) / 2, rMidY = 214 / 2;
  const rCx = baseX, rCy = baseY + 3.04;
  const rMap = (x, y) => [rCx + (x - rMidX) * rScale, rCy + (y - rMidY) * rScale];
  const [rx1, ry1] = rMap(13, 0);
  const [rx2, ry2] = rMap(13, 214);
  const [dx1, dy1] = rMap(13, 0);
  const [dx2, dy2] = rMap(82, 58);
  const [dx3, dy3] = rMap(59, 112);
  const [dx4, dy4] = rMap(96, 214);
  const rStrokeW = Math.max(0.45, 27 * rScale);

  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      {petals.map(([a, l, w], i) => petal(a, l, w, i))}
      <path
        d={`M${rx1},${ry1} L${rx2},${ry2} M${dx1},${dy1} L${dx2},${dy2} L${dx3},${dy3} L${dx4},${dy4}`}
        strokeWidth={rStrokeW}
      />
    </svg>
  );
};

// Echte Coin-Logos direkt von CoinGecko (nicht aus einem veralteten Drittanbieter-Icon-Set —
// das alte Set hatte z.B. Solana nie richtig aufgenommen). Ein einziger Sammel-Request für
// alle unterstützten Coins, modulweit gecacht, damit jede Kachel/jeder Picker-Eintrag densel-
// ben Abruf wiederverwendet. Schlägt das Laden fehl (z.B. offline), fällt automatisch auf die
// handgezeichnete Glyphe zurück, damit nie ein leerer/kaputter Platzhalter zu sehen ist.
let coinImageCache = null; // { [geckoId]: imageUrl }
let coinImageCachePromise = null;
const loadCoinImages = () => {
  if (coinImageCache) return Promise.resolve(coinImageCache);
  if (coinImageCachePromise) return coinImageCachePromise;
  const ids = ['thorchain', ...ALT_COIN_OPTIONS.map((c) => c.geckoId)].join(',');
  coinImageCachePromise = fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`)
    .then((res) => (res.ok ? res.json() : []))
    .then((list) => {
      const map = {};
      (list || []).forEach((c) => { if (c && c.id && c.image) map[c.id] = c.image; });
      coinImageCache = map;
      return map;
    })
    .catch(() => {
      coinImageCache = {};
      return {};
    });
  return coinImageCachePromise;
};

const CoinLogo = ({ code, geckoId, size = 15, glyph }) => {
  const [imgUrl, setImgUrl] = useState(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    let cancelled = false;
    loadCoinImages().then((map) => {
      if (cancelled) return;
      if (map[geckoId]) setImgUrl(map[geckoId]);
      else setFailed(true);
    });
    return () => { cancelled = true; };
  }, [geckoId]);

  if (failed || !imgUrl) {
    if (glyph === 'RUNE') {
      return <IconRuneR size={size * 0.55} solid="#0A0A0A" />;
    }
    return <IconCoinGlyph symbol={glyph} size={size} />;
  }
  return (
    <img
      src={imgUrl}
      width={size} height={size}
      style={{ display: 'block', borderRadius: '50%' }}
      onError={() => setFailed(true)}
      alt={code}
    />
  );
};

// Exakte R-Form aus dem THORChain-Rune-Logo: ein durchgehender Zickzack-Strich
// (Stamm links, dann zwei Diagonalen für Schlaufe + Bein), keine Systemschrift.
// Nur das reine R (kein Kreis drumherum) — als durchgehender Zickzack-Strich:
// Stamm links, dann zwei Diagonalen für Schlaufe und Bein. Genug Rand im viewBox
// oben/unten, damit die abgerundeten Linienenden nicht angeschnitten werden.
// Exakt aus dem Original-Logo vermessene Form (per Farbanalyse der Pixel extrahiert):
// Stamm (senkrecht) als eigener Strich, plus Schlaufe+Bein als zusammenhängender
// Pfad, der oben am Stamm beginnt. So sieht es wirklich wie ein R aus.
const IconRuneR = (p) => {
  const gid = p.gradientId || 'runeRGrad';
  const size = p.size || 13;
  return (
    <svg
      width={size}
      height={size * (214 / 109)}
      viewBox="0 0 109 214"
      xmlns="http://www.w3.org/2000/svg"
      style={{ verticalAlign: 'middle', flexShrink: 0, display: 'inline-block', overflow: 'visible', ...(p.style || {}) }}
    >
      {!p.solid && (
        <defs>
          <linearGradient id={gid} x1="10%" y1="0%" x2="90%" y2="100%">
            <stop offset="0%" stopColor="#3DE0C4" />
            <stop offset="100%" stopColor="#7CE07A" />
          </linearGradient>
        </defs>
      )}
      <path
        d="M13,0 L13,214 M13,0 L82,58 L59,112 L96,214"
        fill="none"
        stroke={p.solid || `url(#${gid})`}
        strokeWidth="27"
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </svg>
  );
};
